   if (epoch + 1) % 10 == 0:\n        print(\n            f\"Epoch {epoch+1}/{NUM_EPOCHS} - Loss: {train_loss:.4f}, Dice: {train_dice:.4f}\"\n        )\n\n# Generate predictions on test set\nprint(\"\\n\" + \"=\" * 50)\nprint(\"Generating test predictions\")\nprint(\"=\" * 50)\n\nfinal_model.eval()\nsubmission_data = []\n\nfor case_id in test_case_ids:\n    # Load modalities with metadata for test set\n    dwi_path = TEST_DIR / f\"{case_id}_dwi.nii.gz\"\n    adc_path = TEST_DIR / f\"{case_id}_adc.nii.gz\"\n    flair_path = TEST_DIR / f\"{case_id}_flair.nii.gz\"\n\n    dwi_nii = nib.load(str(dwi_path))\n    dwi = dwi_nii.get_fdata()\n    affine = dwi_nii.affine\n    header = dwi_nii.header\n    orig_shape = dwi.shape\n\n    # Normalize and resize\n    from scipy.ndimage import zoom\n\n    def normalize_and_resize(data):\n        if data.max() > 0:\n            data = (data - data.mean()) / (data.std() + 1e-8)\n        zoom_factors = [t / s for t, s in zip(TARGET_SIZE, data.shape)]\n        data = zoom(data, zoom_factors, order=1)\n        return data\n\n    dwi = normalize_and_resize(dwi)\n\n    adc_nii = nib.load(str(adc_path))\n    adc = normalize_and_resize(adc_nii.get_fdata())\n\n    flair_nii = nib.load(str(flair_path))\n    flair = normalize_and_resize(flair_nii.get_fdata())\n\n    # Stack and prepare for model\n    image = np.stack([dwi, adc, flair], axis=0).astype(np.float32)\n    image_tensor = torch.from_numpy(image).unsqueeze(0).to(device)\n\n    with torch.no_grad():\n        with autocast():\n            output = final_model(image_tensor)\n\n    pred = torch.sigmoid(output).cpu().numpy()[0, 0]\n    pred_binary = (pred > 0.5).astype(np.uint8)\n\n    # Resize back to original shape\n    zoom_factors = [o / t for o, t in zip(orig_shape, pred_binary.shape)]\n    pred_resized = zoom(pred_binary, zoom_factors, order=0)\n\n    # Save as NIfTI\n    pred_nii = nib.Nifti1Image(pred_resized, affine, header)\n    output_path = SUBMISSION_DIR / f\"{case_id}_pred.nii.gz\"\n    nib.save(pred_nii, output_path)\n\n    # Add to submission\n    submission_data.append(\n        {\n            \"case_id\": case_id,\n            \"predicted_mask_path\": f\"predictions/{case_id}_pred.nii.gz\",\n        }\n    )\n\n    print(f\"Processed {case_id}\")\n\n# Create submission.csv\nsubmission_df = pd.DataFrame(submission_data)\nsubmission_df.to_csv(WORKING_DIR / \"submission.csv\", index=False)\n\nprint(\"\\n\" + \"=\" * 50)\nprint(\"Submission created successfully\")\nprint(\"=\" * 50)\nprint(f\"Submission saved to: {WORKING_DIR / 'submission.csv'}\")\nprint(f\"Predictions saved to: {SUBMISSION_DIR}\")\nprint(\n    f\"\\nFinal Cross-Validation Dice Score: {np.mean(fold_scores):.4f} (+/- {np.std(fold_scores):.4f})\"\n)", "import os\nimport numpy as np\nimport pandas as pd\nimport nibabel as nib\nfrom pathlib import Path\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nfrom torch.utils.data import Dataset, DataLoader\nfrom sklearn.model_selection import KFold\nfrom scipy.ndimage import zoom\nimport warnings\n\nwarnings.filterwarnings(\"ignore\")\n\n# Set device\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\n# Paths\ntrain_dir = Path(\"./input/train\")\ntest_dir = Path(\"./input/test\")\nworking_dir = Path(\"./working\")\nworking_dir.mkdir(exist_ok=True)\n\n# Target size for all volumes\nTARGET_SIZE = (256, 256)\n\n# Load sample submission to get test case IDs\nsample_sub = pd.read_csv(\"./input/sample_submission.csv\")\ntest_case_ids = sample_sub[\"case_id\"].tolist()\n\n# Get training case IDs\ntrain_files = list(train_dir.glob(\"*_msk.nii.gz\"))\ntrain_case_ids = [f.name.replace(\"_msk.nii.gz\", \"\") for f in train_files]\nprint(f\"Found {len(train_case_ids)} training cases\")\nprint(f\"Found {len(test_case_ids)} test cases\")\n\n\n# Helper functions\ndef load_nifti(path):\n    \"\"\"Load NIfTI file and return data array\"\"\"\n    return nib.load(str(path)).get_fdata()\n\n\ndef normalize_volume(volume):\n    \"\"\"Normalize volume to [0, 1] range\"\"\"\n    volume = volume.astype(np.float32)\n    pmin, pmax = np.percentile(volume, [1, 99])\n    volume = np.clip(volume, pmin, pmax)\n    if pmax > pmin:\n        volume = (volume - pmin) / (pmax - pmin)\n    return volume\n\n\ndef resize_volume(volume, target_size, is_mask=False):\n    \"\"\"Resize volume to target size\"\"\"\n    if volume.shape[:2] == target_size:\n        return volume\n\n    zoom_factors = [\n        target_size[0] / volume.shape[0],\n        target_size[1] / volume.shape[1],\n        1.0,\n    ]\n\n    if is_mask:\n        # Use nearest neighbor for masks\n        resized = zoom(volume, zoom_factors, order=0)\n    else:\n        # Use bilinear for images\n        resized = zoom(volume, zoom_factors, order=1)\n\n    return resized\n\n\n# 2.5D Dataset - Fixed version with resizing\nclass StrokeDataset2_5D(Dataset):\n    def __init__(self, case_ids, data_dir, is_test=False, augment=False):\n        self.case_ids = case_ids\n        self.data_dir = Path(data_dir)\n        self.is_test = is_test\n        self.augment = augment\n\n        # Create slice index without pre-loading volumes\n        self.slices = []\n        for case_id in case_ids:\n            # Load mask to determine which slices to include\n            if not is_test:\n                mask_path = self.data_dir / f\"{case_id}_msk.nii.gz\"\n                mask = load_nifti(mask_path)\n                num_slices = mask.shape[2]\n\n                # Only include slices with lesions or randomly sample negatives\n                for slice_idx in range(num_slices):\n                    if mask[:, :, slice_idx].sum() > 0 or np.random.rand() < 0.3:\n                        self.slices.append((case_id, slice_idx))\n            else:\n                # For test, we need to know number of slices\n                adc_path = self.data_dir / f\"{case_id}_adc.nii.gz\"\n                adc = load_nifti(adc_path)\n                num_slices = adc.shape[2]\n                for slice_idx in range(num_slices):\n                    self.slices.append((case_id, slice_idx))\n\n        print(\n            f\"Dataset created with {len(self.slices)} slices from {len(case_ids)} cases\"\n        )\n\n    def __len__(self):\n        return len(self.slices)\n\n    def __getitem__(self, idx):\n        case_id, slice_idx = self.slices[idx]\n\n        # Load volumes on-demand\n        adc = load_nifti(self.data_dir / f\"{case_id}_adc.nii.gz\")\n        dwi = load_nifti(self.data_dir / f\"{case_id}_dwi.nii.gz\")\n        flair = load_nifti(self.data_dir / f\"{case_id}_flair.nii.gz\")\n\n        # Resize volumes to target size BEFORE normalization\n        adc = resize_volume(adc, TARGET_SIZE, is_mask=False)\n        dwi = resize_volume(dwi, TARGET_SIZE, is_mask=False)\n        flair = resize_volume(flair, TARGET_SIZE, is_mask=False)\n\n        # Normalize\n        adc = normalize_volume(adc)\n        dwi = normalize_volume(dwi)\n        flair = normalize_volume(flair)\n\n        if not self.is_test:\n            mask = load_nifti(self.data_dir / f\"{case_id}_msk.nii.gz\")\n            mask = resize_volume(mask, TARGET_SIZE, is_mask=True)\n        else:\n            mask = None\n\n        # Get 2.5D input (current slice + adjacent slices)\n        num_slices = adc.shape[2]\n        prev_idx = max(0, slice_idx - 1)\n        next_idx = min(num_slices - 1, slice_idx + 1)\n\n        # Stack modalities and adjacent slices: 9 channels total\n        input_slice = np.stack(\n            [\n                adc[:, :, prev_idx],\n                dwi[:, :, prev_idx],\n                flair[:, :, prev_idx],\n                adc[:, :, slice_idx],\n                dwi[:, :, slice_idx],\n                flair[:, :, slice_idx],\n                adc[:, :, next_idx],\n                dwi[:, :, next_idx],\n                flair[:, :, next_idx],\n            ],\n            axis=0,\n        )\n\n        if not self.is_test:\n            mask_slice = mask[:, :, slice_idx].astype(np.float32)\n        else:\n            mask_slice = np.zeros(TARGET_SIZE, dtype=np.float32)\n\n        # Augmentation\n        if self.augment and not self.is_test:\n            if np.random.rand() > 0.5:\n                input_slice = np.flip(input_slice, axis=1).copy()\n                mask_slice = np.flip(mask_slice, axis=0).copy()\n            if np.random.rand() > 0.5:\n                input_slice = np.flip(input_slice, axis=2).copy()\n                mask_slice = np.flip(mask_slice, axis=1).copy()\n\n        input_slice = torch.from_numpy(input_slice).float()\n        mask_slice = torch.from_numpy(mask_slice).float().unsqueeze(0)\n\n        return input_slice, mask_slice, case_id, slice_idx\n\n\n# ResNet-based U-Net model\nclass ResBlock(nn.Module):\n    def __init__(self, in_channels, out_channels):\n        super().__init__()\n        self.conv1 = nn.Conv2d(in_channels, out_channels, 3, padding=1)\n        self.bn1 = nn.BatchNorm2d(out_channels)\n        self.conv2 = nn.Conv2d(out_channels, out_channels, 3, padding=1)\n        self.bn2 = nn.BatchNorm2d(out_channels)\n\n        self.shortcut = nn.Sequential()\n        if in_channels != out_channels:\n            self.shortcut = nn.Sequential(\n                nn.Conv2d(in_channels, out_channels, 1), nn.BatchNorm2d(out_channels)\n            )\n\n    def forward(self, x):\n        residual = self.shortcut(x)\n        x = F.relu(self.bn1(self.conv1(x)))\n        x = self.bn2(self.conv2(x))\n        x += residual\n        x = F.relu(x)\n        return x\n\n\nclass ResUNet(nn.Module):\n    def __init__(self, in_channels=9, out_channels=1):\n        super().__init__()\n\n        # Encoder\n        self.enc1 = ResBlock(in_channels, 32)\n        self.enc2 = ResBlock(32, 64)\n        self.enc3 = ResBlock(64, 128)\n        self.enc4 = ResBlock(128, 256)\n\n        # Bridge\n        self.bridge = ResBlock(256, 512)\n\n        # Decoder\n        self.up4 = nn.ConvTranspose2d(512, 256, 2, stride=2)\n        self.dec4 = ResBlock(512, 256)\n\n        self.up3 = nn.ConvTranspose2d(256, 128, 2, stride=2)\n        self.dec3 = ResBlock(256, 128)\n\n        self.up2 = nn.ConvTranspose2d(128, 64, 2, stride=2)\n        self.dec2 = ResBlock(128, 64)\n\n        self.up1 = nn.ConvTranspose2d(64, 32, 2, stride=2)\n        self.dec1 = ResBlock(64, 32)\n\n        self.out = nn.Conv2d(32, out_channels, 1)\n        self.pool = nn.MaxPool2d(2)\n\n    def forward(self, x):\n        # Encoder\n        e1 = self.enc1(x)\n        e2 = self.enc2(self.pool(e1))\n        e3 = self.enc3(self.pool(e2))\n        e4 = self.enc4(self.pool(e3))\n\n        # Bridge\n        b = self.bridge(self.pool(e4))\n\n        # Decoder with skip connections\n        d4 = self.up4(b)\n        d4 = torch.cat([d4, e4], dim=1)\n        d4 = self.dec4(d4)\n\n        d3 = self.up3(d4)\n        d3 = torch.cat([d3, e3], dim=1)\n        d3 = self.dec3(d3)\n\n        d2 = self.up2(d3)\n        d2 = torch.cat([d2, e2], dim=1)\n        d2 = self.dec2(d2)\n\n        d1 = self.up1(d2)\n        d1 = torch.cat([d1, e1], dim=1)\n        d1 = self.dec1(d1)\n\n        out = self.out(d1)\n        return out\n\n\n# Dice loss\nclass DiceLoss(nn.Module):\n    def __init__(self, smooth=1.0):\n        super().__init__()\n        self.smooth = smooth\n\n    def forward(self, pred, target):\n        pred = torch.sigmoid(pred)\n        pred = pred.view(-1)\n        target = target.view(-1)\n\n        intersection = (pred * target).sum()\n        dice = (2.0 * intersection + self.smooth) / (\n            pred.sum() + target.sum() + self.smooth\n        )\n\n        return 1 - dice\n\n\n# Combined loss\nclass CombinedLoss(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.dice_loss = DiceLoss()\n        self.bce_loss = nn.BCEWithLogitsLoss()\n\n    def forward(self, pred, target):\n        return self.dice_loss(pred, target) + self.bce_loss(pred, target)\n\n\n# Dice metric\ndef dice_score(pred, target, threshold=0.5):\n    pred = (torch.sigmoid(pred) > threshold).float()\n    pred = pred.view(-1)\n    target = target.view(-1)\n\n    intersection = (pred * target).sum()\n    if pred.sum() + target.sum() == 0:\n        return 1.0\n\n    dice = (2.0 * intersection) / (pred.sum() + target.sum())\n    return dice.item()\n\n\n# Training function\ndef train_epoch(model, loader, optimizer, criterion, device):\n    model.train()\n    total_loss = 0\n    total_dice = 0\n\n    for batch_idx, (inputs, targets, _, _) in enumerate(loader):\n        inputs, targets = inputs.to(device), targets.to(device)\n\n        optimizer.zero_grad()\n        outputs = model(inputs)\n\n        loss = criterion(outputs, targets)\n        loss.backward()\n        optimizer.step()\n\n        total_loss += loss.item()\n        total_dice += dice_score(outputs, targets)\n\n    return total_loss / len(loader), total_dice / len(loader)\n\n\n# Validation function\ndef validate(model, loader, criterion, device):\n    model.eval()\n    total_loss = 0\n    total_dice = 0\n\n    with torch.no_grad():\n        for inputs, targets, _, _ in loader:\n            inputs, targets = inputs.to(device), targets.to(device)\n            outputs = model(inputs)\n\n            loss = criterion(outputs, targets)\n            total_loss += loss.item()\n            total_dice += dice_score(outputs, targets)\n\n    return total_loss / len(loader), total_dice / len(loader)\n\n\n# 5-Fold Cross-Validation\nkf = KFold(n_splits=5, shuffle=True, random_state=42)\nfold_dice_scores = []\n\nprint(\"\\nStarting 5-Fold Cross-Validation...\")\n\nfor fold, (train_idx, val_idx) in enumerate(kf.split(train_case_ids)):\n    print(f\"\\n{'='*50}\")\n    print(f\"Fold {fold+1}/5\")\n    print(f\"{'='*50}\")\n\n    train_cases = [train_case_ids[i] for i in train_idx]\n    val_cases = [train_case_ids[i] for i in val_idx]\n\n    # Create datasets\n    train_dataset = StrokeDataset2_5D(\n        train_cases, train_dir, is_test=False, augment=True\n    )\n    val_dataset = StrokeDataset2_5D(val_cases, train_dir, is_test=False, augment=False)\n\n    train_loader = DataLoader(train_dataset, batch_size=16, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_dataset, batch_size=16, shuffle=False, num_workers=4)\n\n    # Model, optimizer, criterion\n    model = ResUNet(in_channels=9, out_channels=1).to(device)\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\n    scheduler = torch.optim.lr_scheduler.ReduceLROnPlateau(\n        optimizer, mode=\"max\", factor=0.5, patience=3\n    )\n    criterion = CombinedLoss()\n\n    best_dice = 0\n    patience_counter = 0\n    max_patience = 5\n\n    # Train for fewer epochs per fold\n    for epoch in range(15):\n        train_loss, train_dice = train_epoch(\n            model, train_loader, optimizer, criterion, device\n        )\n        val_loss, val_dice = validate(model, val_loader, criterion, device)\n\n        scheduler.step(val_dice)\n\n        print(\n            f\"Epoch {epoch+1}/15: Train Loss={train_loss:.4f}, Train Dice={train_dice:.4f}, \"\n            f\"Val Loss={val_loss:.4f}, Val Dice={val_dice:.4f}\"\n        )\n\n        if val_dice > best_dice:\n            best_dice = val_dice\n            patience_counter = 0\n            # Save best model for this fold\n            torch.save(model.state_dict(), working_dir / f\"best_model_fold{fold}.pth\")\n        else:\n            patience_counter += 1\n            if patience_counter >= max_patience:\n                print(f\"Early stopping at epoch {epoch+1}\")\n                break\n\n    fold_dice_scores.append(best_dice)\n    print(f\"Fold {fold+1} Best Dice: {best_dice:.4f}\")\n\n# Print CV results\nmean_dice = np.mean(fold_dice_scores)\nstd_dice = np.std(fold_dice_scores)\nprint(f\"\\n{'='*50}\")\nprint(f\"5-Fold Cross-Validation Results:\")\nprint(f\"{'='*50}\")\nprint(f\"Mean Dice Score: {mean_dice:.4f} \u00b1 {std_dice:.4f}\")\nprint(f\"Individual Fold Scores: {[f'{d:.4f}' for d in fold_dice_scores]}\")\n\n# Train final model on all training data\nprint(f\"\\n{'='*50}\")\nprint(\"Training final model on all training data...\")\nprint(f\"{'='*50}\")\n\nfull_train_dataset = StrokeDataset2_5D(\n    train_case_ids, train_dir, is_test=False, augment=True\n)\nfull_train_loader = DataLoader(\n    full_train_dataset, batch_size=16, shuffle=True, num_workers=4\n)\n\nfinal_model = ResUNet(in_channels=9, out_channels=1).to(device)\noptimizer = torch.optim.Adam(final_model.parameters(), lr=1e-3)\nscheduler = torch.optim.lr_scheduler.CosineAnnealingLR(optimizer, T_max=20)\ncriterion = CombinedLoss()\n\nfor epoch in range(20):\n    train_loss, train_dice = train_epoch(\n        final_model, full_train_loader, optimizer, criterion, device\n    )\n    scheduler.step()\n    print(\n        f\"Epoch {epoch+1}/20: Train Loss={train_loss:.4f}, Train Dice={train_dice:.4f}\"\n    )\n\n# Save final model\ntorch.save(final_model.state_dict(), working_dir / \"final_model.pth\")\n\n# Generate predictions for test set\nprint(f\"\\n{'='*50}\")\nprint(\"Generating test predictions...\")\nprint(f\"{'='*50}\")\n\nfinal_model.eval()\n\n# Create predictions directory\npred_dir = working_dir / \"predictions\"\npred_dir.mkdir(exist_ok=True)\n\nsubmission_data = []\n\nfor case_id in test_case_ids:\n    print(f\"Processing {case_id}...\")\n\n    # Load test volumes\n    adc = load_nifti(test_dir / f\"{case_id}_adc.nii.gz\")\n    dwi = load_nifti(test_dir / f\"{case_id}_dwi.nii.gz\")\n    flair = load_nifti(test_dir / f\"{case_id}_flair.nii.gz\")\n\n    # Get original NIfTI for header info and original shape\n    original_nii = nib.load(test_dir / f\"{case_id}_adc.nii.gz\")\n    original_shape = adc.shape\n\n    # Resize volumes to target size\n    adc_resized = resize_volume(adc, TARGET_SIZE, is_mask=False)\n    dwi_resized = resize_volume(dwi, TARGET_SIZE, is_mask=False)\n    flair_resized = resize_volume(flair, TARGET_SIZE, is_mask=False)\n\n    # Normalize\n    adc_resized = normalize_volume(adc_resized)\n    dwi_resized = normalize_volume(dwi_resized)\n    flair_resized = normalize_volume(flair_resized)\n\n    # Predict slice by slice\n    num_slices = adc_resized.shape[2]\n    pred_volume_resized = np.zeros(adc_resized.shape, dtype=np.float32)\n\n    with torch.no_grad():\n        for slice_idx in range(num_slices):\n            prev_idx = max(0, slice_idx - 1)\n            next_idx = min(num_slices - 1, slice_idx + 1)\n\n            # Create 2.5D input\n            input_slice = np.stack(\n                [\n                    adc_resized[:, :, prev_idx],\n                    dwi_resized[:, :, prev_idx],\n                    flair_resized[:, :, prev_idx],\n                    adc_resized[:, :, slice_idx],\n                    dwi_resized[:, :, slice_idx],\n                    flair_resized[:, :, slice_idx],\n                    adc_resized[:, :, next_idx],\n                    dwi_resized[:, :, next_idx],\n                    flair_resized[:, :, next_idx],\n                ],\n                axis=0,\n            )\n\n            input_tensor = torch.from_numpy(input_slice).unsqueeze(0).float().to(device)\n            output = final_model(input_tensor)\n            pred_slice = torch.sigmoid(output).squeeze().cpu().numpy()\n            pred_volume_resized[:, :, slice_idx] = pred_slice\n\n    # Resize prediction back to original shape\n    zoom_factors = [\n        original_shape[0] / TARGET_SIZE[0],\n        original_shape[1] / TARGET_SIZE[1],\n        1.0,\n    ]\n    pred_volume = zoom(pred_volume_resized, zoom_factors, order=1)\n\n    # Threshold and convert to binary\n    pred_mask = (pred_volume > 0.5).astype(np.uint8)\n\n    # Save prediction\n    pred_nii = nib.Nifti1Image(pred_mask, original_nii.affine, original_nii.header)\n    pred_path = pred_dir / f\"{case_id}_pred.nii.gz\"\n    nib.save(pred_nii, pred_path)\n\n    submission_data.append(\n        {\n            \"case_id\": case_id,\n            \"predicted_mask_path\": f\"predictions/{case_id}_pred.nii.gz\",\n        }\n    )\n\n# Save submission CSV\nsubmission_df = pd.DataFrame(submission_data)\nsubmission_df.to_csv(working_dir / \"submission.csv\", index=False)\n\nprint(f\"\\n{'='*50}\")\nprint(\"Submission file created successfully!\")\nprint(f\"Total test cases processed: {len(test_case_ids)}\")\nprint(f\"{'='*50}\")\nprint(f\"\\nFinal Validation Metric (Mean Dice from 5-Fold CV): {mean_dice:.4f}\")", "import os\nimport numpy as np\nimport pandas as pd\nimport nibabel as nib\nfrom pathlib import Path\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nfrom torch.utils.data import Dataset, DataLoader\nfrom sklearn.model_selection import KFold\nfrom scipy.ndimage import zoom\nimport warnings\n\nwarnings.filterwarnings(\"ignore\")\n\n# Set device\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\n# Paths\ntrain_dir = Path(\"./input/train\")\ntest_dir = Path(\"./input/test\")\nworking_dir = Path(\"./working\")\nworking_dir.mkdir(exist_ok=True)\n\n# Target size for all volumes\nTARGET_SIZE = (256, 256)\n\n# Load sample submission to get test case IDs\nsample_sub = pd.read_csv(\"./input/sample_submission.csv\")\ntest_case_ids = sample_sub[\"case_id\"].tolist()\n\n# Get training case IDs\ntrain_files = list(train_dir.glob(\"*_msk.nii.gz\"))\ntrain_case_ids = [f.name.replace(\"_msk.nii.gz\", \"\") for f in train_files]\nprint(f\"Found {len(train_case_ids)} training cases\")\nprint(f\"Found {len(test_case_ids)} test cases\")\n\n\n# Helper functions\ndef load_nifti(path):\n    \"\"\"Load NIfTI file and return data array\"\"\"\n    return nib.load(str(path)).get_fdata()\n\n\ndef normalize_volume(volume):\n    \"\"\"Normalize volume to [0, 1] range\"\"\"\n    volume = volume.astype(np.float32)\n    pmin, pmax = np.percentile(volume, [1, 99])\n    volume = np.clip(volume, pmin, pmax)\n    if pmax > pmin:\n        volume = (volume - pmin) / (pmax - pmin)\n    return volume\n\n\ndef resize_volume(volume, target_size, is_mask=False):\n    \"\"\"Resize volume to target size (only x, y dimensions)\"\"\"\n    if volume.shape[:2] == target_size:\n        return volume\n\n    zoom_factors = [\n        target_size[0] / volume.shape[0],\n        target_size[1] / volume.shape[1],\n        1.0,  # Keep z-axis unchanged\n    ]\n\n    if is_mask:\n        # Use nearest neighbor for masks\n        resized = zoom(volume, zoom_factors, order=0)\n    else:\n        # Use bilinear for images\n        resized = zoom(volume, zoom_factors, order=1)\n\n    return resized\n\n\n# 2.5D Dataset - Fixed version\nclass StrokeDataset2_5D(Dataset):\n    def __init__(self, case_ids, data_dir, is_test=False, augment=False):\n        self.case_ids = case_ids\n        self.data_dir = Path(data_dir)\n        self.is_test = is_test\n        self.augment = augment\n\n        # Create slice index by loading each volume to get true slice count\n        self.slices = []\n        for case_id in case_ids:\n            # Load one volume to get the actual number of slices\n            adc_path = self.data_dir / f\"{case_id}_adc.nii.gz\"\n            adc = load_nifti(adc_path)\n            num_slices = adc.shape[2]  # Original z-axis size\n\n            if not is_test:\n                mask_path = self.data_dir / f\"{case_id}_msk.nii.gz\"\n                mask = load_nifti(mask_path)\n\n                # Only include slices with lesions or randomly sample negatives\n                for slice_idx in range(num_slices):\n                    if mask[:, :, slice_idx].sum() > 0 or np.random.rand() < 0.3:\n                        self.slices.append((case_id, slice_idx))\n            else:\n                # For test, include all slices\n                for slice_idx in range(num_slices):\n                    self.slices.append((case_id, slice_idx))\n\n        print(\n            f\"Dataset created with {len(self.slices)} slices from {len(case_ids)} cases\"\n        )\n\n    def __len__(self):\n        return len(self.slices)\n\n    def __getitem__(self, idx):\n        case_id, slice_idx = self.slices[idx]\n\n        # Load volumes on-demand\n        adc = load_nifti(self.data_dir / f\"{case_id}_adc.nii.gz\")\n        dwi = load_nifti(self.data_dir / f\"{case_id}_dwi.nii.gz\")\n        flair = load_nifti(self.data_dir / f\"{case_id}_flair.nii.gz\")\n\n        if not self.is_test:\n            mask = load_nifti(self.data_dir / f\"{case_id}_msk.nii.gz\")\n        else:\n            mask = None\n\n        # Get number of slices from loaded volume\n        num_slices = adc.shape[2]\n\n        # Get adjacent slice indices\n        prev_idx = max(0, slice_idx - 1)\n        next_idx = min(num_slices - 1, slice_idx + 1)\n\n        # Extract slices BEFORE resizing\n        adc_prev = adc[:, :, prev_idx]\n        dwi_prev = dwi[:, :, prev_idx]\n        flair_prev = flair[:, :, prev_idx]\n\n        adc_curr = adc[:, :, slice_idx]\n        dwi_curr = dwi[:, :, slice_idx]\n        flair_curr = flair[:, :, slice_idx]\n\n        adc_next = adc[:, :, next_idx]\n        dwi_next = dwi[:, :, next_idx]\n        flair_next = flair[:, :, next_idx]\n\n        # Normalize each 2D slice\n        adc_prev = normalize_volume(adc_prev)\n        dwi_prev = normalize_volume(dwi_prev)\n        flair_prev = normalize_volume(flair_prev)\n\n        adc_curr = normalize_volume(adc_curr)\n        dwi_curr = normalize_volume(dwi_curr)\n        flair_curr = normalize_volume(flair_curr)\n\n        adc_next = normalize_volume(adc_next)\n        dwi_next = normalize_volume(dwi_next)\n        flair_next = normalize_volume(flair_next)\n\n        # Resize 2D slices\n        if adc_prev.shape != TARGET_SIZE:\n            zoom_factors = [\n                TARGET_SIZE[0] / adc_prev.shape[0],\n                TARGET_SIZE[1] / adc_prev.shape[1],\n            ]\n            adc_prev = zoom(adc_prev, zoom_factors, order=1)\n            dwi_prev = zoom(dwi_prev, zoom_factors, order=1)\n            flair_prev = zoom(flair_prev, zoom_factors, order=1)\n            adc_curr = zoom(adc_curr, zoom_factors, order=1)\n            dwi_curr = zoom(dwi_curr, zoom_factors, order=1)\n            flair_curr = zoom(flair_curr, zoom_factors, order=1)\n            adc_next = zoom(adc_next, zoom_factors, order=1)\n            dwi_next = zoom(dwi_next, zoom_factors, order=1)\n            flair_next = zoom(flair_next, zoom_factors, order=1)\n\n        # Stack modalities and adjacent slices: 9 channels total\n        input_slice = np.stack(\n            [\n                adc_prev,\n                dwi_prev,\n                flair_prev,\n                adc_curr,\n                dwi_curr,\n                flair_curr,\n                adc_next,\n                dwi_next,\n                flair_next,\n            ],\n            axis=0,\n        )\n\n        if not self.is_test:\n            mask_slice = mask[:, :, slice_idx].astype(np.float32)\n            # Resize mask slice\n            if mask_slice.shape != TARGET_SIZE:\n                mask_slice = zoom(mask_slice, zoom_factors, order=0)\n        else:\n            mask_slice = np.zeros(TARGET_SIZE, dtype=np.float32)\n\n        # Augmentation\n        if self.augment and not self.is_test:\n            if np.random.rand() > 0.5:\n                input_slice = np.flip(input_slice, axis=1).copy()\n                mask_slice = np.flip(mask_slice, axis=0).copy()\n            if np.random.rand() > 0.5:\n                input_slice = np.flip(input_slice, axis=2).copy()\n                mask_slice = np.flip(mask_slice, axis=1).copy()\n\n        input_slice = torch.from_numpy(input_slice).float()\n        mask_slice = torch.from_numpy(mask_slice).float().unsqueeze(0)\n\n        return input_slice, mask_slice, case_id, slice_idx\n\n\n# ResNet-based U-Net model\nclass ResBlock(nn.Module):\n    def __init__(self, in_channels, out_channels):\n        super().__init__()\n        self.conv1 = nn.Conv2d(in_channels, out_channels, 3, padding=1)\n        self.bn1 = nn.BatchNorm2d(out_channels)\n        self.conv2 = nn.Conv2d(out_channels, out_channels, 3, padding=1)\n        self.bn2 = nn.BatchNorm2d(out_channels)\n\n        self.shortcut = nn.Sequential()\n        if in_channels != out_channels:\n            self.shortcut = nn.Sequential(\n                nn.Conv2d(in_channels, out_channels, 1), nn.BatchNorm2d(out_channels)\n            )\n\n    def forward(self, x):\n        residual = self.shortcut(x)\n        x = F.relu(self.bn1(self.conv1(x)))\n        x = self.bn2(self.conv2(x))\n        x += residual\n        x = F.relu(x)\n        return x\n\n\nclass ResUNet(nn.Module):\n    def __init__(self, in_channels=9, out_channels=1):\n        super().__init__()\n\n        # Encoder\n        self.enc1 = ResBlock(in_channels, 32)\n        self.enc2 = ResBlock(32, 64)\n        self.enc3 = ResBlock(64, 128)\n        self.enc4 = ResBlock(128, 256)\n\n        # Bridge\n        self.bridge = ResBlock(256, 512)\n\n        # Decoder\n        self.up4 = nn.ConvTranspose2d(512, 256, 2, stride=2)\n        self.dec4 = ResBlock(512, 256)\n\n        self.up3 = nn.ConvTranspose2d(256, 128, 2, stride=2)\n        self.dec3 = ResBlock(256, 128)\n\n        self.up2 = nn.ConvTranspose2d(128, 64, 2, stride=2)\n        self.dec2 = ResBlock(128, 64)\n\n        self.up1 = nn.ConvTranspose2d(64, 32, 2, stride=2)\n        self.dec1 = ResBlock(64, 32)\n\n        self.out = nn.Conv2d(32, out_channels, 1)\n        self.pool = nn.MaxPool2d(2)\n\n    def forward(self, x):\n        # Encoder\n        e1 = self.enc1(x)\n        e2 = self.enc2(self.pool(e1))\n        e3 = self.enc3(self.pool(e2))\n        e4 = self.enc4(self.pool(e3))\n\n        # Bridge\n        b = self.bridge(self.pool(e4))\n\n        # Decoder with skip connections\n        d4 = self.up4(b)\n        d4 = torch.cat([d4, e4], dim=1)\n        d4 = self.dec4(d4)\n\n        d3 = self.up3(d4)\n        d3 = torch.cat([d3, e3], dim=1)\n        d3 = self.dec3(d3)\n\n        d2 = self.up2(d3)\n        d2 = torch.cat([d2, e2], dim=1)\n        d2 = self.dec2(d2)\n\n        d1 = self.up1(d2)\n        d1 = torch.cat([d1, e1], dim=1)\n        d1 = self.dec1(d1)\n\n        out = self.out(d1)\n        return out\n\n\n# Dice loss\nclass DiceLoss(nn.Module):\n    def __init__(self, smooth=1.0):\n        super().__init__()\n        self.smooth = smooth\n\n    def forward(self, pred, target):\n        pred = torch.sigmoid(pred)\n        pred = pred.view(-1)\n        target = target.view(-1)\n\n        intersection = (pred * target).sum()\n        dice = (2.0 * intersection + self.smooth) / (\n            pred.sum() + target.sum() + self.smooth\n        )\n\n        return 1 - dice\n\n\n# Combined loss\nclass CombinedLoss(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.dice_loss = DiceLoss()\n        self.bce_loss = nn.BCEWithLogitsLoss()\n\n    def forward(self, pred, target):\n        return self.dice_loss(pred, target) + self.bce_loss(pred, target)\n\n\n# Dice metric\ndef dice_score(pred, target, threshold=0.5):\n    pred = (torch.sigmoid(pred) > threshold).float()\n    pred = pred.view(-1)\n    target = target.view(-1)\n\n    intersection = (pred * target).sum()\n    if pred.sum() + target.sum() == 0:\n        return 1.0\n\n    dice = (2.0 * intersection) / (pred.sum() + target.sum())\n    return dice.item()\n\n\n# Training function\ndef train_epoch(model, loader, optimizer, criterion, device):\n    model.train()\n    total_loss = 0\n    total_dice = 0\n\n    for batch_idx, (inputs, targets, _, _) in enumerate(loader):\n        inputs, targets = inputs.to(device), targets.to(device)\n\n        optimizer.zero_grad()\n        outputs = model(inputs)\n\n        loss = criterion(outputs, targets)\n        loss.backward()\n        optimizer.step()\n\n        total_loss += loss.item()\n        total_dice += dice_score(outputs, targets)\n\n    return total_loss / len(loader), total_dice / len(loader)\n\n\n# Validation function\ndef validate(model, loader, criterion, device):\n    model.eval()\n    total_loss = 0\n    total_dice = 0\n\n    with torch.no_grad():\n        for inputs, targets, _, _ in loader:\n            inputs, targets = inputs.to(device), targets.to(device)\n            outputs = model(inputs)\n\n            loss = criterion(outputs, targets)\n            total_loss += loss.item()\n            total_dice += dice_score(outputs, targets)\n\n    return total_loss / len(loader), total_dice / len(loader)\n\n\n# 5-Fold Cross-Validation\nkf = KFold(n_splits=5, shuffle=True, random_state=42)\nfold_dice_scores = []\n\nprint(\"\\nStarting 5-Fold Cross-Validation...\")\n\nfor fold, (train_idx, val_idx) in enumerate(kf.split(train_case_ids)):\n    print(f\"\\n{'='*50}\")\n    print(f\"Fold {fold+1}/5\")\n    print(f\"{'='*50}\")\n\n    train_cases = [train_case_ids[i] for i in train_idx]\n    val_cases = [train_case_ids[i] for i in val_idx]\n\n    # Create datasets\n    train_dataset = StrokeDataset2_5D(\n        train_cases, train_dir, is_test=False, augment=True\n    )\n    val_dataset = StrokeDataset2_5D(val_cases, train_dir, is_test=False, augment=False)\n\n    train_loader = DataLoader(train_dataset, batch_size=16, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_dataset, batch_size=16, shuffle=False, num_workers=4)\n\n    # Model, optimizer, criterion\n    model = ResUNet(in_channels=9, out_channels=1).to(device)\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\n    scheduler = torch.optim.lr_scheduler.ReduceLROnPlateau(\n        optimizer, mode=\"max\", factor=0.5, patience=3\n    )\n    criterion = CombinedLoss()\n\n    best_dice = 0\n    patience_counter = 0\n    max_patience = 5\n\n    # Train for fewer epochs per fold\n    for epoch in range(15):\n        train_loss, train_dice = train_epoch(\n            model, train_loader, optimizer, criterion, device\n        )\n        val_loss, val_dice = validate(model, val_loader, criterion, device)\n\n        scheduler.step(val_dice)\n\n        print(\n            f\"Epoch {epoch+1}/15: Train Loss={train_loss:.4f}, Train Dice={train_dice:.4f}, \"\n            f\"Val Loss={val_loss:.4f}, Val Dice={val_dice:.4f}\"\n        )\n\n        if val_dice > best_dice:\n            best_dice = val_dice\n            patience_counter = 0\n            # Save best model for this fold\n            torch.save(model.state_dict(), working_dir / f\"best_model_fold{fold}.pth\")\n        else:\n            patience_counter += 1\n            if patience_counter >= max_patience:\n                print(f\"Early stopping at epoch {epoch+1}\")\n                break\n\n    fold_dice_scores.append(best_dice)\n    print(f\"Fold {fold+1} Best Dice: {best_dice:.4f}\")\n\n# Print CV results\nmean_dice = np.mean(fold_dice_scores)\nstd_dice = np.std(fold_dice_scores)\nprint(f\"\\n{'='*50}\")\nprint(f\"5-Fold Cross-Validation Results:\")\nprint(f\"{'='*50}\")\nprint(f\"Mean Dice Score: {mean_dice:.4f} \u00b1 {std_dice:.4f}\")\nprint(f\"Individual Fold Scores: {[f'{d:.4f}' for d in fold_dice_scores]}\")\n\n# Train final model on all training data\nprint(f\"\\n{'='*50}\")\nprint(\"Training final model on all training data...\")\nprint(f\"{'='*50}\")\n\nfull_train_dataset = StrokeDataset2_5D(\n    train_case_ids, train_dir, is_test=False, augment=True\n)\nfull_train_loader = DataLoader(\n    full_train_dataset, batch_size=16, shuffle=True, num_workers=4\n)\n\nfinal_model = ResUNet(in_channels=9, out_channels=1).to(device)\noptimizer = torch.optim.Adam(final_model.parameters(), lr=1e-3)\nscheduler = torch.optim.lr_scheduler.CosineAnnealingLR(optimizer, T_max=20)\ncriterion = CombinedLoss()\n\nfor epoch in range(20):\n    train_loss, train_dice = train_epoch(\n        final_model, full_train_loader, optimizer, criterion, device\n    )\n    scheduler.step()\n    print(\n        f\"Epoch {epoch+1}/20: Train Loss={train_loss:.4f}, Train Dice={train_dice:.4f}\"\n    )\n\n# Save final model\ntorch.save(final_model.state_dict(), working_dir / \"final_model.pth\")\n\n# Generate predictions for test set\nprint(f\"\\n{'='*50}\")\nprint(\"Generating test predictions...\")\nprint(f\"{'='*50}\")\n\nfinal_model.eval()\n\n# Create predictions directory inside working directory\npred_dir = working_dir / \"predictions\"\npred_dir.mkdir(exist_ok=True)\n\nsubmission_data = []\n\nfor case_id in test_case_ids:\n    print(f\"Processing {case_id}...\")\n\n    # Load test volumes\n    adc = load_nifti(test_dir / f\"{case_id}_adc.nii.gz\")\n    dwi = load_nifti(test_dir / f\"{case_id}_dwi.nii.gz\")\n    flair = load_nifti(test_dir / f\"{case_id}_flair.nii.gz\")\n\n    # Get original NIfTI for header info and original shape\n    original_nii = nib.load(test_dir / f\"{case_id}_adc.nii.gz\")\n    original_shape = adc.shape\n\n    # Predict slice by slice\n    num_slices = adc.shape[2]\n    pred_volume = np.zeros(original_shape, dtype=np.float32)\n\n    with torch.no_grad():\n        for slice_idx in range(num_slices):\n            prev_idx = max(0, slice_idx - 1)\n            next_idx = min(num_slices - 1, slice_idx + 1)\n\n            # Extract 2D slices\n            adc_prev = normalize_volume(adc[:, :, prev_idx])\n            dwi_prev = normalize_volume(dwi[:, :, prev_idx])\n            flair_prev = normalize_volume(flair[:, :, prev_idx])\n\n            adc_curr = normalize_volume(adc[:, :, slice_idx])\n            dwi_curr = normalize_volume(dwi[:, :, slice_idx])\n            flair_curr = normalize_volume(flair[:, :, slice_idx])\n\n            adc_next = normalize_volume(adc[:, :, next_idx])\n            dwi_next = normalize_volume(dwi[:, :, next_idx])\n            flair_next = normalize_volume(flair[:, :, next_idx])\n\n            # Resize to target size\n            if adc_prev.shape != TARGET_SIZE:\n                zoom_factors = [\n                    TARGET_SIZE[0] / adc_prev.shape[0],\n                    TARGET_SIZE[1] / adc_prev.shape[1],\n                ]\n                adc_prev = zoom(adc_prev, zoom_factors, order=1)\n                dwi_prev = zoom(dwi_prev, zoom_factors, order=1)\n                flair_prev = zoom(flair_prev, zoom_factors, order=1)\n                adc_curr = zoom(adc_curr, zoom_factors, order=1)\n                dwi_curr = zoom(dwi_curr, zoom_factors, order=1)\n                flair_curr = zoom(flair_curr, zoom_factors, order=1)\n                adc_next = zoom(adc_next, zoom_factors, order=1)\n                dwi_next = zoom(dwi_next, zoom_factors, order=1)\n                flair_next = zoom(flair_next, zoom_factors, order=1)\n\n            # Create 2.5D input\n            input_slice = np.stack(\n                [\n                    adc_prev,\n                    dwi_prev,\n                    flair_prev,\n                    adc_curr,\n                    dwi_curr,\n                    flair_curr,\n                    adc_next,\n                    dwi_next,\n                    flair_next,\n                ],\n                axis=0,\n            )\n\n            input_tensor = torch.from_numpy(input_slice).unsqueeze(0).float().to(device)\n            output = final_model(input_tensor)\n            pred_slice = torch.sigmoid(output).squeeze().cpu().numpy()\n\n            # Resize prediction back to original shape\n            if pred_slice.shape != original_shape[:2]:\n                zoom_factors_back = [\n                    original_shape[0] / TARGET_SIZE[0],\n                    original_shape[1] / TARGET_SIZE[1],\n                ]\n                pred_slice = zoom(pred_slice, zoom_factors_back, order=1)\n\n            pred_volume[:, :, slice_idx] = pred_slice\n\n    # Threshold and convert to binary\n    pred_mask = (pred_volume > 0.5).astype(np.uint8)\n\n    # Save prediction\n    pred_nii = nib.Nifti1Image(pred_mask, original_nii.affine, original_nii.header)\n    pred_path = pred_dir / f\"{case_id}_pred.nii.gz\"\n    nib.save(pred_nii, pred_path)\n\n    submission_data.append(\n        {\n            \"case_id\": case_id,\n            \"predicted_mask_path\": f\"predictions/{case_id}_pred.nii.gz\",\n        }\n    )\n\n# Save submission CSV in the working directory\nsubmission_df = pd.DataFrame(submission_data)\nsubmission_df.to_csv(working_dir / \"submission.csv\", index=False)\n\nprint(f\"\\n{'='*50}\")\nprint(\"Submission file created successfully!\")\nprint(f\"Total test cases processed: {len(test_case_ids)}\")\nprint(f\"{'='*50}\")\nprint(f\"\\nFinal Validation Metric (Mean Dice from 5-Fold CV): {mean_dice:.4f}\")", "import os\nimport numpy as np\nimport pandas as pd\nimport nibabel as nib\nfrom pathlib import Path\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nfrom torch.utils.data import Dataset, DataLoader\nfrom sklearn.model_selection import KFold\nfrom scipy.ndimage import zoom\nimport warnings\n\nwarnings.filterwarnings(\"ignore\")\n\n# Set device\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\n# Paths\ntrain_dir = Path(\"./input/train\")\ntest_dir = Path(\"./input/test\")\nworking_dir = Path(\"./working\")\nworking_dir.mkdir(exist_ok=True)\n\n# Target size for all volumes\nTARGET_SIZE = (128, 128)  # Reduced for faster training\n\n# Load sample submission to get test case IDs\nsample_sub = pd.read_csv(\"./input/sample_submission.csv\")\ntest_case_ids = sample_sub[\"case_id\"].tolist()\n\n# Get training case IDs\ntrain_files = list(train_dir.glob(\"*_msk.nii.gz\"))\ntrain_case_ids = [f.name.replace(\"_msk.nii.gz\", \"\") for f in train_files]\nprint(f\"Found {len(train_case_ids)} training cases\")\nprint(f\"Found {len(test_case_ids)} test cases\")\n\n\n# Helper functions\ndef load_nifti(path):\n    \"\"\"Load NIfTI file and return data array\"\"\"\n    return nib.load(str(path)).get_fdata()\n\n\ndef normalize_volume(volume):\n    \"\"\"Normalize volume to [0, 1] range\"\"\"\n    volume = volume.astype(np.float32)\n    pmin, pmax = np.percentile(volume, [1, 99])\n    volume = np.clip(volume, pmin, pmax)\n    if pmax > pmin:\n        volume = (volume - pmin) / (pmax - pmin)\n    return volume\n\n\n# 2.5D Dataset - Fixed version\nclass StrokeDataset2_5D(Dataset):\n    def __init__(self, case_ids, data_dir, is_test=False, augment=False):\n        self.case_ids = case_ids\n        self.data_dir = Path(data_dir)\n        self.is_test = is_test\n        self.augment = augment\n\n        # Create slice index by verifying all modalities have consistent shapes\n        self.slices = []\n        for case_id in case_ids:\n            # Load all volumes to verify consistency\n            adc_path = self.data_dir / f\"{case_id}_adc.nii.gz\"\n            dwi_path = self.data_dir / f\"{case_id}_dwi.nii.gz\"\n            flair_path = self.data_dir / f\"{case_id}_flair.nii.gz\"\n\n            adc = load_nifti(adc_path)\n            dwi = load_nifti(dwi_path)\n            flair = load_nifti(flair_path)\n\n            # Verify all modalities have the same shape\n            if not (adc.shape == dwi.shape == flair.shape):\n                print(\n                    f\"Warning: Shape mismatch for {case_id}: ADC={adc.shape}, DWI={dwi.shape}, FLAIR={flair.shape}\"\n                )\n                # Use the minimum number of slices\n                num_slices = min(adc.shape[2], dwi.shape[2], flair.shape[2])\n            else:\n                num_slices = adc.shape[2]\n\n            if not is_test:\n                mask_path = self.data_dir / f\"{case_id}_msk.nii.gz\"\n                mask = load_nifti(mask_path)\n\n                # Only include slices with lesions or randomly sample negatives\n                for slice_idx in range(num_slices):\n                    if slice_idx < mask.shape[2]:  # Safety check\n                        if mask[:, :, slice_idx].sum() > 0 or np.random.rand() < 0.3:\n                            self.slices.append((case_id, slice_idx))\n            else:\n                # For test, include all slices\n                for slice_idx in range(num_slices):\n                    self.slices.append((case_id, slice_idx))\n\n        print(\n            f\"Dataset created with {len(self.slices)} slices from {len(case_ids)} cases\"\n        )\n\n    def __len__(self):\n        return len(self.slices)\n\n    def __getitem__(self, idx):\n        case_id, slice_idx = self.slices[idx]\n\n        # Load volumes on-demand\n        adc = load_nifti(self.data_dir / f\"{case_id}_adc.nii.gz\")\n        dwi = load_nifti(self.data_dir / f\"{case_id}_dwi.nii.gz\")\n        flair = load_nifti(self.data_dir / f\"{case_id}_flair.nii.gz\")\n\n        if not self.is_test:\n            mask = load_nifti(self.data_dir / f\"{case_id}_msk.nii.gz\")\n        else:\n            mask = None\n\n        # Get number of slices - use minimum to be safe\n        num_slices = min(adc.shape[2], dwi.shape[2], flair.shape[2])\n\n        # Ensure slice_idx is within bounds\n        slice_idx = min(slice_idx, num_slices - 1)\n\n        # Get adjacent slice indices\n        prev_idx = max(0, slice_idx - 1)\n        next_idx = min(num_slices - 1, slice_idx + 1)\n\n        # Extract slices\n        adc_prev = adc[:, :, prev_idx]\n        dwi_prev = dwi[:, :, prev_idx]\n        flair_prev = flair[:, :, prev_idx]\n\n        adc_curr = adc[:, :, slice_idx]\n        dwi_curr = dwi[:, :, slice_idx]\n        flair_curr = flair[:, :, slice_idx]\n\n        adc_next = adc[:, :, next_idx]\n        dwi_next = dwi[:, :, next_idx]\n        flair_next = flair[:, :, next_idx]\n\n        # Normalize each 2D slice\n        adc_prev = normalize_volume(adc_prev)\n        dwi_prev = normalize_volume(dwi_prev)\n        flair_prev = normalize_volume(flair_prev)\n\n        adc_curr = normalize_volume(adc_curr)\n        dwi_curr = normalize_volume(dwi_curr)\n        flair_curr = normalize_volume(flair_curr)\n\n        adc_next = normalize_volume(adc_next)\n        dwi_next = normalize_volume(dwi_next)\n        flair_next = normalize_volume(flair_next)\n\n        # Resize 2D slices\n        if adc_prev.shape != TARGET_SIZE:\n            zoom_factors = [\n                TARGET_SIZE[0] / adc_prev.shape[0],\n                TARGET_SIZE[1] / adc_prev.shape[1],\n            ]\n            adc_prev = zoom(adc_prev, zoom_factors, order=1)\n            dwi_prev = zoom(dwi_prev, zoom_factors, order=1)\n            flair_prev = zoom(flair_prev, zoom_factors, order=1)\n            adc_curr = zoom(adc_curr, zoom_factors, order=1)\n            dwi_curr = zoom(dwi_curr, zoom_factors, order=1)\n            flair_curr = zoom(flair_curr, zoom_factors, order=1)\n            adc_next = zoom(adc_next, zoom_factors, order=1)\n            dwi_next = zoom(dwi_next, zoom_factors, order=1)\n            flair_next = zoom(flair_next, zoom_factors, order=1)\n\n        # Stack modalities and adjacent slices: 9 channels total\n        input_slice = np.stack(\n            [\n                adc_prev,\n                dwi_prev,\n                flair_prev,\n                adc_curr,\n                dwi_curr,\n                flair_curr,\n                adc_next,\n                dwi_next,\n                flair_next,\n            ],\n            axis=0,\n        )\n\n        if not self.is_test:\n            if slice_idx < mask.shape[2]:\n                mask_slice = mask[:, :, slice_idx].astype(np.float32)\n            else:\n                mask_slice = np.zeros(adc_curr.shape, dtype=np.float32)\n            # Resize mask slice\n            if mask_slice.shape != TARGET_SIZE:\n                mask_slice = zoom(mask_slice, zoom_factors, order=0)\n        else:\n            mask_slice = np.zeros(TARGET_SIZE, dtype=np.float32)\n\n        # Augmentation\n        if self.augment and not self.is_test:\n            if np.random.rand() > 0.5:\n                input_slice = np.flip(input_slice, axis=1).copy()\n                mask_slice = np.flip(mask_slice, axis=0).copy()\n            if np.random.rand() > 0.5:\n                input_slice = np.flip(input_slice, axis=2).copy()\n                mask_slice = np.flip(mask_slice, axis=1).copy()\n\n        input_slice = torch.from_numpy(input_slice).float()\n        mask_slice = torch.from_numpy(mask_slice).float().unsqueeze(0)\n\n        return input_slice, mask_slice, case_id, slice_idx\n\n\n# ResNet-based U-Net model\nclass ResBlock(nn.Module):\n    def __init__(self, in_channels, out_channels):\n        super().__init__()\n        self.conv1 = nn.Conv2d(in_channels, out_channels, 3, padding=1)\n        self.bn1 = nn.BatchNorm2d(out_channels)\n        self.conv2 = nn.Conv2d(out_channels, out_channels, 3, padding=1)\n        self.bn2 = nn.BatchNorm2d(out_channels)\n\n        self.shortcut = nn.Sequential()\n        if in_channels != out_channels:\n            self.shortcut = nn.Sequential(\n                nn.Conv2d(in_channels, out_channels, 1), nn.BatchNorm2d(out_channels)\n            )\n\n    def forward(self, x):\n        residual = self.shortcut(x)\n        x = F.relu(self.bn1(self.conv1(x)))\n        x = self.bn2(self.conv2(x))\n        x += residual\n        x = F.relu(x)\n        return x\n\n\nclass ResUNet(nn.Module):\n    def __init__(self, in_channels=9, out_channels=1):\n        super().__init__()\n\n        # Encoder\n        self.enc1 = ResBlock(in_channels, 32)\n        self.enc2 = ResBlock(32, 64)\n        self.enc3 = ResBlock(64, 128)\n        self.enc4 = ResBlock(128, 256)\n\n        # Bridge\n        self.bridge = ResBlock(256, 512)\n\n        # Decoder\n        self.up4 = nn.ConvTranspose2d(512, 256, 2, stride=2)\n        self.dec4 = ResBlock(512, 256)\n\n        self.up3 = nn.ConvTranspose2d(256, 128, 2, stride=2)\n        self.dec3 = ResBlock(256, 128)\n\n        self.up2 = nn.ConvTranspose2d(128, 64, 2, stride=2)\n        self.dec2 = ResBlock(128, 64)\n\n        self.up1 = nn.ConvTranspose2d(64, 32, 2, stride=2)\n        self.dec1 = ResBlock(64, 32)\n\n        self.out = nn.Conv2d(32, out_channels, 1)\n        self.pool = nn.MaxPool2d(2)\n\n    def forward(self, x):\n        # Encoder\n        e1 = self.enc1(x)\n        e2 = self.enc2(self.pool(e1))\n        e3 = self.enc3(self.pool(e2))\n        e4 = self.enc4(self.pool(e3))\n\n        # Bridge\n        b = self.bridge(self.pool(e4))\n\n        # Decoder with skip connections\n        d4 = self.up4(b)\n        d4 = torch.cat([d4, e4], dim=1)\n        d4 = self.dec4(d4)\n\n        d3 = self.up3(d4)\n        d3 = torch.cat([d3, e3], dim=1)\n        d3 = self.dec3(d3)\n\n        d2 = self.up2(d3)\n        d2 = torch.cat([d2, e2], dim=1)\n        d2 = self.dec2(d2)\n\n        d1 = self.up1(d2)\n        d1 = torch.cat([d1, e1], dim=1)\n        d1 = self.dec1(d1)\n\n        out = self.out(d1)\n        return out\n\n\n# Dice loss\nclass DiceLoss(nn.Module):\n    def __init__(self, smooth=1.0):\n        super().__init__()\n        self.smooth = smooth\n\n    def forward(self, pred, target):\n        pred = torch.sigmoid(pred)\n        pred = pred.view(-1)\n        target = target.view(-1)\n\n        intersection = (pred * target).sum()\n        dice = (2.0 * intersection + self.smooth) / (\n            pred.sum() + target.sum() + self.smooth\n        )\n\n        return 1 - dice\n\n\n# Combined loss\nclass CombinedLoss(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.dice_loss = DiceLoss()\n        self.bce_loss = nn.BCEWithLogitsLoss()\n\n    def forward(self, pred, target):\n        return self.dice_loss(pred, target) + self.bce_loss(pred, target)\n\n\n# Dice metric\ndef dice_score(pred, target, threshold=0.5):\n    pred = (torch.sigmoid(pred) > threshold).float()\n    pred = pred.view(-1)\n    target = target.view(-1)\n\n    intersection = (pred * target).sum()\n    if pred.sum() + target.sum() == 0:\n        return 1.0\n\n    dice = (2.0 * intersection) / (pred.sum() + target.sum())\n    return dice.item()\n\n\n# Training function\ndef train_epoch(model, loader, optimizer, criterion, device):\n    model.train()\n    total_loss = 0\n    total_dice = 0\n\n    for batch_idx, (inputs, targets, _, _) in enumerate(loader):\n        inputs, targets = inputs.to(device), targets.to(device)\n\n        optimizer.zero_grad()\n        outputs = model(inputs)\n\n        loss = criterion(outputs, targets)\n        loss.backward()\n        optimizer.step()\n\n        total_loss += loss.item()\n        total_dice += dice_score(outputs, targets)\n\n    return total_loss / len(loader), total_dice / len(loader)\n\n\n# Validation function\ndef validate(model, loader, criterion, device):\n    model.eval()\n    total_loss = 0\n    total_dice = 0\n\n    with torch.no_grad():\n        for inputs, targets, _, _ in loader:\n            inputs, targets = inputs.to(device), targets.to(device)\n            outputs = model(inputs)\n\n            loss = criterion(outputs, targets)\n            total_loss += loss.item()\n            total_dice += dice_score(outputs, targets)\n\n    return total_loss / len(loader), total_dice / len(loader)\n\n\n# 5-Fold Cross-Validation\nkf = KFold(n_splits=5, shuffle=True, random_state=42)\nfold_dice_scores = []\n\nprint(\"\\nStarting 5-Fold Cross-Validation...\")\n\nfor fold, (train_idx, val_idx) in enumerate(kf.split(train_case_ids)):\n    print(f\"\\n{'='*50}\")\n    print(f\"Fold {fold+1}/5\")\n    print(f\"{'='*50}\")\n\n    train_cases = [train_case_ids[i] for i in train_idx]\n    val_cases = [train_case_ids[i] for i in val_idx]\n\n    # Create datasets\n    train_dataset = StrokeDataset2_5D(\n        train_cases, train_dir, is_test=False, augment=True\n    )\n    val_dataset = StrokeDataset2_5D(val_cases, train_dir, is_test=False, augment=False)\n\n    train_loader = DataLoader(train_dataset, batch_size=16, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_dataset, batch_size=16, shuffle=False, num_workers=4)\n\n    # Model, optimizer, criterion\n    model = ResUNet(in_channels=9, out_channels=1).to(device)\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\n    scheduler = torch.optim.lr_scheduler.ReduceLROnPlateau(\n        optimizer, mode=\"max\", factor=0.5, patience=3\n    )\n    criterion = CombinedLoss()\n\n    best_dice = 0\n    patience_counter = 0\n    max_patience = 5\n\n    # Train for fewer epochs per fold\n    for epoch in range(15):\n        train_loss, train_dice = train_epoch(\n            model, train_loader, optimizer, criterion, device\n        )\n        val_loss, val_dice = validate(model, val_loader, criterion, device)\n\n        scheduler.step(val_dice)\n\n        print(\n            f\"Epoch {epoch+1}/15: Train Loss={train_loss:.4f}, Train Dice={train_dice:.4f}, \"\n            f\"Val Loss={val_loss:.4f}, Val Dice={val_dice:.4f}\"\n        )\n\n        if val_dice > best_dice:\n            best_dice = val_dice\n            patience_counter = 0\n            torch.save(model.state_dict(), working_dir / f\"best_model_fold{fold}.pth\")\n        else:\n            patience_counter += 1\n            if patience_counter >= max_patience:\n                print(f\"Early stopping at epoch {epoch+1}\")\n                break\n\n    fold_dice_scores.append(best_dice)\n    print(f\"Fold {fold+1} Best Dice: {best_dice:.4f}\")\n\n# Print CV results\nmean_dice = np.mean(fold_dice_scores)\nstd_dice = np.std(fold_dice_scores)\nprint(f\"\\n{'='*50}\")\nprint(f\"5-Fold Cross-Validation Results:\")\nprint(f\"{'='*50}\")\nprint(f\"Mean Dice Score: {mean_dice:.4f} \u00b1 {std_dice:.4f}\")\nprint(f\"Individual Fold Scores: {[f'{d:.4f}' for d in fold_dice_scores]}\")\n\n# Train final model on all training data\nprint(f\"\\n{'='*50}\")\nprint(\"Training final model on all training data...\")\nprint(f\"{'='*50}\")\n\nfull_train_dataset = StrokeDataset2_5D(\n    train_case_ids, train_dir, is_test=False, augment=True\n)\nfull_train_loader = DataLoader(\n    full_train_dataset, batch_size=16, shuffle=True, num_workers=4\n)\n\nfinal_model = ResUNet(in_channels=9, out_channels=1).to(device)\noptimizer = torch.optim.Adam(final_model.parameters(), lr=1e-3)\nscheduler = torch.optim.lr_scheduler.CosineAnnealingLR(optimizer, T_max=20)\ncriterion = CombinedLoss()\n\nfor epoch in range(20):\n    train_loss, train_dice = train_epoch(\n        final_model, full_train_loader, optimizer, criterion, device\n    )\n    scheduler.step()\n    print(\n        f\"Epoch {epoch+1}/20: Train Loss={train_loss:.4f}, Train Dice={train_dice:.4f}\"\n    )\n\n# Save final model\ntorch.save(final_model.state_dict(), working_dir / \"final_model.pth\")\n\n# Generate predictions for test set\nprint(f\"\\n{'='*50}\")\nprint(\"Generating test predictions...\")\nprint(f\"{'='*50}\")\n\nfinal_model.eval()\n\n# Create submission directory\nsubmission_dir = Path(\"./submission\")\nsubmission_dir.mkdir(exist_ok=True)\npred_dir = submission_dir / \"predictions\"\npred_dir.mkdir(exist_ok=True)\n\nsubmission_data = []\n\nfor case_id in test_case_ids:\n    print(f\"Processing {case_id}...\")\n\n    # Load test volumes\n    adc = load_nifti(test_dir / f\"{case_id}_adc.nii.gz\")\n    dwi = load_nifti(test_dir / f\"{case_id}_dwi.nii.gz\")\n    flair = load_nifti(test_dir / f\"{case_id}_flair.nii.gz\")\n\n    # Get original NIfTI for header info and original shape\n    original_nii = nib.load(test_dir / f\"{case_id}_adc.nii.gz\")\n    original_shape = adc.shape\n\n    # Use minimum number of slices across all modalities\n    num_slices = min(adc.shape[2], dwi.shape[2], flair.shape[2])\n\n    # Predict slice by slice\n    pred_volume = np.zeros(original_shape, dtype=np.float32)\n\n    with torch.no_grad():\n        for slice_idx in range(num_slices):\n            prev_idx = max(0, slice_idx - 1)\n            next_idx = min(num_slices - 1, slice_idx + 1)\n\n            # Extract 2D slices\n            adc_prev = normalize_volume(adc[:, :, prev_idx])\n            dwi_prev = normalize_volume(dwi[:, :, prev_idx])\n            flair_prev = normalize_volume(flair[:, :, prev_idx])\n\n            adc_curr = normalize_volume(adc[:, :, slice_idx])\n            dwi_curr = normalize_volume(dwi[:, :, slice_idx])\n            flair_curr = normalize_volume(flair[:, :, slice_idx])\n\n            adc_next = normalize_volume(adc[:, :, next_idx])\n            dwi_next = normalize_volume(dwi[:, :, next_idx])\n            flair_next = normalize_volume(flair[:, :, next_idx])\n\n            # Resize to target size\n            if adc_prev.shape != TARGET_SIZE:\n                zoom_factors = [\n                    TARGET_SIZE[0] / adc_prev.shape[0],\n                    TARGET_SIZE[1] / adc_prev.shape[1],\n                ]\n                adc_prev = zoom(adc_prev, zoom_factors, order=1)\n                dwi_prev = zoom(dwi_prev, zoom_factors, order=1)\n                flair_prev = zoom(flair_prev, zoom_factors, order=1)\n                adc_curr = zoom(adc_curr, zoom_factors, order=1)\n                dwi_curr = zoom(dwi_curr, zoom_factors, order=1)\n                flair_curr = zoom(flair_curr, zoom_factors, order=1)\n                adc_next = zoom(adc_next, zoom_factors, order=1)\n                dwi_next = zoom(dwi_next, zoom_factors, order=1)\n                flair_next = zoom(flair_next, zoom_factors, order=1)\n\n            # Create 2.5D input\n            input_slice = np.stack(\n                [\n                    adc_prev,\n                    dwi_prev,\n                    flair_prev,\n                    adc_curr,\n                    dwi_curr,\n                    flair_curr,\n                    adc_next,\n                    dwi_next,\n                    flair_next,\n                ],\n                axis=0,\n            )\n\n            input_tensor = torch.from_numpy(input_slice).unsqueeze(0).float().to(device)\n            output = final_model(input_tensor)\n            pred_slice = torch.sigmoid(output).squeeze().cpu().numpy()\n\n            # Resize prediction back to original shape\n            if pred_slice.shape != original_shape[:2]:\n                zoom_factors_back = [\n                    original_shape[0] / TARGET_SIZE[0],\n                    original_shape[1] / TARGET_SIZE[1],\n                ]\n                pred_slice = zoom(pred_slice, zoom_factors_back, order=1)\n\n            pred_volume[:, :, slice_idx] = pred_slice\n\n    # Threshold and convert to binary\n    pred_mask = (pred_volume > 0.5).astype(np.uint8)\n\n    # Save prediction\n    pred_nii = nib.Nifti1Image(pred_mask, original_nii.affine, original_nii.header)\n    pred_path = pred_dir / f\"{case_id}_pred.nii.gz\"\n    nib.save(pred_nii, pred_path)\n\n    submission_data.append(\n        {\n            \"case_id\": case_id,\n            \"predicted_mask_path\": f\"predictions/{case_id}_pred.nii.gz\",\n        }\n    )\n\n# Save submission CSV\nsubmission_df = pd.DataFrame(submission_data)\nsubmission_df.to_csv(submission_dir / \"submission.csv\", index=False)\n\nprint(f\"\\n{'='*50}\")\nprint(\"Submission file created successfully!\")\nprint(f\"Total test cases processed: {len(test_case_ids)}\")\nprint(f\"{'='*50}\")\nprint(f\"\\nFinal Validation Metric (Mean Dice from 5-Fold CV): {mean_dice:.4f}\")", "import os\nimport numpy as np\nimport pandas as pd\nimport nibabel as nib\nfrom pathlib import Path\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nfrom torch.utils.data import Dataset, DataLoader\nfrom sklearn.model_selection import KFold\nfrom scipy.ndimage import zoom\nimport warnings\n\nwarnings.filterwarnings(\"ignore\")\n\n# Set device\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\n# Paths\ntrain_dir = Path(\"./input/train\")\ntest_dir = Path(\"./input/test\")\nworking_dir = Path(\"./working\")\nworking_dir.mkdir(exist_ok=True)\n\n# Target size for all volumes\nTARGET_SIZE = (128, 128)  # Reduced for faster training\n\n# Load sample submission to get test case IDs\nsample_sub = pd.read_csv(\"./input/sample_submission.csv\")\ntest_case_ids = sample_sub[\"case_id\"].tolist()\n\n# Get training case IDs\ntrain_files = list(train_dir.glob(\"*_msk.nii.gz\"))\ntrain_case_ids = [f.name.replace(\"_msk.nii.gz\", \"\") for f in train_files]\nprint(f\"Found {len(train_case_ids)} training cases\")\nprint(f\"Found {len(test_case_ids)} test cases\")\n\n\n# Helper functions\ndef load_nifti(path):\n    \"\"\"Load NIfTI file and return data array\"\"\"\n    return nib.load(str(path)).get_fdata()\n\n\ndef normalize_volume(volume):\n    \"\"\"Normalize volume to [0, 1] range\"\"\"\n    volume = volume.astype(np.float32)\n    pmin, pmax = np.percentile(volume, [1, 99])\n    volume = np.clip(volume, pmin, pmax)\n    if pmax > pmin:\n        volume = (volume - pmin) / (pmax - pmin)\n    return volume\n\n\ndef resize_slice(slice_2d, target_size):\n    \"\"\"Resize a 2D slice to target size\"\"\"\n    if slice_2d.shape == target_size:\n        return slice_2d\n    zoom_factors = [\n        target_size[0] / slice_2d.shape[0],\n        target_size[1] / slice_2d.shape[1],\n    ]\n    return zoom(slice_2d, zoom_factors, order=1)\n\n\n# 2.5D Dataset - Fixed version\nclass StrokeDataset2_5D(Dataset):\n    def __init__(self, case_ids, data_dir, is_test=False, augment=False):\n        self.case_ids = case_ids\n        self.data_dir = Path(data_dir)\n        self.is_test = is_test\n        self.augment = augment\n\n        # Create slice index by verifying all modalities have consistent shapes\n        self.slices = []\n        for case_id in case_ids:\n            # Load all volumes to verify consistency\n            adc_path = self.data_dir / f\"{case_id}_adc.nii.gz\"\n            dwi_path = self.data_dir / f\"{case_id}_dwi.nii.gz\"\n            flair_path = self.data_dir / f\"{case_id}_flair.nii.gz\"\n\n            adc = load_nifti(adc_path)\n            dwi = load_nifti(dwi_path)\n            flair = load_nifti(flair_path)\n\n            # Use the minimum number of slices across all modalities\n            num_slices = min(adc.shape[2], dwi.shape[2], flair.shape[2])\n\n            if not is_test:\n                mask_path = self.data_dir / f\"{case_id}_msk.nii.gz\"\n                mask = load_nifti(mask_path)\n\n                # Only include slices with lesions or randomly sample negatives\n                for slice_idx in range(num_slices):\n                    if slice_idx < mask.shape[2]:  # Safety check\n                        if mask[:, :, slice_idx].sum() > 0 or np.random.rand() < 0.3:\n                            self.slices.append((case_id, slice_idx))\n            else:\n                # For test, include all slices\n                for slice_idx in range(num_slices):\n                    self.slices.append((case_id, slice_idx))\n\n        print(\n            f\"Dataset created with {len(self.slices)} slices from {len(case_ids)} cases\"\n        )\n\n    def __len__(self):\n        return len(self.slices)\n\n    def __getitem__(self, idx):\n        case_id, slice_idx = self.slices[idx]\n\n        # Load volumes on-demand\n        adc = load_nifti(self.data_dir / f\"{case_id}_adc.nii.gz\")\n        dwi = load_nifti(self.data_dir / f\"{case_id}_dwi.nii.gz\")\n        flair = load_nifti(self.data_dir / f\"{case_id}_flair.nii.gz\")\n\n        if not self.is_test:\n            mask = load_nifti(self.data_dir / f\"{case_id}_msk.nii.gz\")\n        else:\n            mask = None\n\n        # Get number of slices - use minimum to be safe\n        num_slices = min(adc.shape[2], dwi.shape[2], flair.shape[2])\n\n        # Ensure slice_idx is within bounds\n        slice_idx = min(slice_idx, num_slices - 1)\n\n        # Get adjacent slice indices\n        prev_idx = max(0, slice_idx - 1)\n        next_idx = min(num_slices - 1, slice_idx + 1)\n\n        # Extract slices - FIX: Extract, normalize, and resize BEFORE stacking\n        # Previous slice\n        adc_prev = adc[:, :, prev_idx]\n        dwi_prev = dwi[:, :, prev_idx]\n        flair_prev = flair[:, :, prev_idx]\n\n        adc_prev = normalize_volume(adc_prev)\n        dwi_prev = normalize_volume(dwi_prev)\n        flair_prev = normalize_volume(flair_prev)\n\n        adc_prev = resize_slice(adc_prev, TARGET_SIZE)\n        dwi_prev = resize_slice(dwi_prev, TARGET_SIZE)\n        flair_prev = resize_slice(flair_prev, TARGET_SIZE)\n\n        # Current slice\n        adc_curr = adc[:, :, slice_idx]\n        dwi_curr = dwi[:, :, slice_idx]\n        flair_curr = flair[:, :, slice_idx]\n\n        adc_curr = normalize_volume(adc_curr)\n        dwi_curr = normalize_volume(dwi_curr)\n        flair_curr = normalize_volume(flair_curr)\n\n        adc_curr = resize_slice(adc_curr, TARGET_SIZE)\n        dwi_curr = resize_slice(dwi_curr, TARGET_SIZE)\n        flair_curr = resize_slice(flair_curr, TARGET_SIZE)\n\n        # Next slice\n        adc_next = adc[:, :, next_idx]\n        dwi_next = dwi[:, :, next_idx]\n        flair_next = flair[:, :, next_idx]\n\n        adc_next = normalize_volume(adc_next)\n        dwi_next = normalize_volume(dwi_next)\n        flair_next = normalize_volume(flair_next)\n\n        adc_next = resize_slice(adc_next, TARGET_SIZE)\n        dwi_next = resize_slice(dwi_next, TARGET_SIZE)\n        flair_next = resize_slice(flair_next, TARGET_SIZE)\n\n        # Now all slices are guaranteed to be TARGET_SIZE, so stack will work\n        input_slice = np.stack(\n            [\n                adc_prev,\n                dwi_prev,\n                flair_prev,\n                adc_curr,\n                dwi_curr,\n                flair_curr,\n                adc_next,\n                dwi_next,\n                flair_next,\n            ],\n            axis=0,\n        )\n\n        if not self.is_test:\n            if slice_idx < mask.shape[2]:\n                mask_slice = mask[:, :, slice_idx].astype(np.float32)\n            else:\n                mask_slice = np.zeros(TARGET_SIZE, dtype=np.float32)\n            # Resize mask slice\n ose2d(512, 256, 2, stride=2)\n        self.dec4 = ResBlock(512, 256)\n\n        self.up3 = nn.ConvTranspose2d(256, 128, 2, stride=2)\n        self.dec3 = ResBlock(256, 128)\n\n        self.up2 = nn.ConvTranspose2d(128, 64, 2, stride=2)\n        self.dec2 = ResBlock(128, 64)\n\n        self.up1 = nn.ConvTranspose2d(64, 32, 2, stride=2)\n        self.dec1 = ResBlock(64, 32)\n\n        self.out = nn.Conv2d(32, out_channels, 1)\n        self.pool = nn.MaxPool2d(2)\n\n    def forward(self, x):\n        # Encoder\n        e1 = self.enc1(x)\n        e2 = self.enc2(self.pool(e1))\n        e3 = self.enc3(self.pool(e2))\n        e4 = self.enc4(self.pool(e3))\n\n        # Bridge\n        b = self.bridge(self.pool(e4))\n\n        # Decoder with skip connections\n        d4 = self.up4(b)\n        d4 = torch.cat([d4, e4], dim=1)\n        d4 = self.dec4(d4)\n\n        d3 = self.up3(d4)\n        d3 = torch.cat([d3, e3], dim=1)\n        d3 = self.dec3(d3)\n\n        d2 = self.up2(d3)\n        d2 = torch.cat([d2, e2], dim=1)\n        d2 = self.dec2(d2)\n\n        d1 = self.up1(d2)\n        d1 = torch.cat([d1, e1], dim=1)\n        d1 = self.dec1(d1)\n\n        out = self.out(d1)\n        return out\n\n\n# Dice loss\nclass DiceLoss(nn.Module):\n    def __init__(self, smooth=1.0):\n        super().__init__()\n        self.smooth = smooth\n\n    def forward(self, pred, target):\n        pred = torch.sigmoid(pred)\n        pred = pred.view(-1)\n        target = target.view(-1)\n\n        intersection = (pred * target).sum()\n        dice = (2.0 * intersection + self.smooth) / (\n            pred.sum() + target.sum() + self.smooth\n        )\n\n        return 1 - dice\n\n\n# Combined loss\nclass CombinedLoss(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.dice_loss = DiceLoss()\n        self.bce_loss = nn.BCEWithLogitsLoss()\n\n    def forward(self, pred, target):\n        return self.dice_loss(pred, target) + self.bce_loss(pred, target)\n\n\n# Dice metric\ndef dice_score(pred, target, threshold=0.5):\n    pred = (torch.sigmoid(pred) > threshold).float()\n    pred = pred.view(-1)\n    target = target.view(-1)\n\n    intersection = (pred * target).sum()\n    if pred.sum() + target.sum() == 0:\n        return 1.0\n\n    dice = (2.0 * intersection) / (pred.sum() + target.sum())\n    return dice.item()\n\n\n# Training function\ndef train_epoch(model, loader, optimizer, criterion, device):\n    model.train()\n    total_loss = 0\n    total_dice = 0\n\n    for batch_idx, (inputs, targets, _, _) in enumerate(loader):\n        inputs, targets = inputs.to(device), targets.to(device)\n\n        optimizer.zero_grad()\n        outputs = model(inputs)\n\n        loss = criterion(outputs, targets)\n        loss.backward()\n        optimizer.step()\n\n        total_loss += loss.item()\n        total_dice += dice_score(outputs, targets)\n\n    return total_loss / len(loader), total_dice / len(loader)\n\n\n# Validation function\ndef validate(model, loader, criterion, device):\n    model.eval()\n    total_loss = 0\n    total_dice = 0\n\n    with torch.no_grad():\n        for inputs, targets, _, _ in loader:\n            inputs, targets = inputs.to(device), targets.to(device)\n            outputs = model(inputs)\n\n            loss = criterion(outputs, targets)\n            total_loss += loss.item()\n            total_dice += dice_score(outputs, targets)\n\n    return total_loss / len(loader), total_dice / len(loader)\n\n\n# 5-Fold Cross-Validation\nkf = KFold(n_splits=5, shuffle=True, random_state=42)\nfold_dice_scores = []\n\nprint(\"\\nStarting 5-Fold Cross-Validation...\")\n\nfor fold, (train_idx, val_idx) in enumerate(kf.split(train_case_ids)):\n    print(f\"\\n{'='*50}\")\n    print(f\"Fold {fold+1}/5\")\n    print(f\"{'='*50}\")\n\n    train_cases = [train_case_ids[i] for i in train_idx]\n    val_cases = [train_case_ids[i] for i in val_idx]\n\n    # Create datasets\n    train_dataset = StrokeDataset2_5D(\n        train_cases, train_ let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
