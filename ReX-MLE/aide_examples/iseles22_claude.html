let treeStructData = {"edges": [[0, 7], [1, 8], [3, 5], [4, 6], [6, 9], [9, 10], [10, 11], [11, 12]], "layout": [[0.0, 0.0], [0.25, 0.0], [0.5, 0.0], [0.75, 0.0], [1.0, 0.0], [0.75, 0.19999999999999996], [1.0, 0.19999999999999996], [0.0, 0.19999999999999996], [0.25, 0.19999999999999996], [1.0, 0.4], [1.0, 0.6], [1.0, 0.8], [1.0, 1.0]], "plan": ["Looking at this medical image segmentation challenge, I need to:  1. Build a 3D\nU-Net model to segment stroke lesions from multimodal MRI (DWI, ADC, FLAIR) 2.\nTrain on the provided training data with ground truth masks 3. Evaluate using\nDice score on a validation split 4. Generate predictions for the test set in the\nrequired format  I'll use a standard 3D U-Net architecture with three input\nchannels (one per modality), train with Dice loss, and use data augmentation to\nimprove generalization. For efficiency, I'll train for a limited number of\nepochs with smaller patches to keep runtime reasonable. The evaluation will use\na 80/20 train/validation split to estimate performance before generating test\npredictions.", "Looking at this task, I need to build a stroke lesion segmentation model using\nmultimodal MRI (DWI, ADC, FLAIR) to predict binary masks. I'll use a 3D U-Net\narchitecture with PyTorch, which is well-suited for medical image segmentation.\nThe model will be trained on the training data with ground truth masks,\nvalidated using 5-fold cross-validation with Dice score as the metric, and then\nmake predictions on the test set. I'll use data augmentation, mixed precision\ntraining for efficiency, and save predictions in the required NIfTI format.", "Looking at this challenge, I need to segment ischemic stroke lesions from\nmultimodal MRI (DWI, ADC, FLAIR). I'll implement a 3D U-Net architecture which\nis well-suited for medical image segmentation. The model will take all three\nmodalities as input channels and output binary segmentation masks. I'll use\n5-fold cross-validation on the training set to evaluate performance using Dice\nscore as the primary metric, then train on all training data to generate\npredictions for the test set.", "Looking at this task, I need to segment ischemic stroke lesions from multimodal\nMRI. Given that the previous 3D U-Net approach achieved 0.6388 Dice score, I'll\ntry a different architecture: **nnU-Net inspired approach with a 2.5D\nstrategy**. Instead of full 3D processing which is memory-intensive, I'll\nextract 2D slices from all three axes (axial, sagittal, coronal) with multi-\nchannel input (DWI, ADC, FLAIR), train separate 2D U-Net models for each view,\nand ensemble their predictions. This should provide better GPU utilization and\ncapture anatomical information from multiple perspectives. I'll use 5-fold\ncross-validation to evaluate performance, measuring mean Dice score across\nfolds.", "Looking at this task, I'll implement a 2.5D approach using a ResNet-based U-Net\narchitecture. Instead of processing full 3D volumes (which can be memory-\nintensive), I'll extract 2D slices with additional context from adjacent slices,\neffectively creating a 2.5D input. This approach is computationally efficient\nwhile still capturing some 3D context. I'll use data augmentation including\nrandom flips and rotations, train with a combination of Dice loss and BCE loss,\nand validate using 5-fold cross-validation on the training set with Dice score\nas the primary metric.", "The bug occurs because the three MRI modalities (DWI, ADC, FLAIR) have different\nspatial dimensions for some cases. The solution is to resample all modalities to\na common shape before stacking them. I'll add a resampling function that resizes\nADC and FLAIR to match the DWI shape using scipy's zoom function with\nappropriate interpolation. This ensures all modalities have the same dimensions\nbefore stacking into a multi-channel volume.", "The bug occurs because the code pre-loads all volumes during dataset\ninitialization and stores references to them, but different cases have different\nnumbers of slices. When accessing `flair[:, :, prev_idx]` for a slice from one\ncase, it's trying to use an index that's valid for that case but may exceed the\nbounds of another case's volume stored in the tuple. The fix is to load volumes\non-demand in `__getitem__` rather than storing them during initialization,\nensuring each slice access uses the correct volume dimensions for that specific\ncase.", "Looking at the error, the issue is that the three input modalities (DWI, ADC,\nFLAIR) have different spatial dimensions, which causes `np.stack` to fail.\nMedical images often have different resolutions across modalities. The fix is to\nresample all modalities to a common shape before stacking them. I'll use the DWI\nimage as the reference shape and resample ADC and FLAIR to match it using\nscipy's zoom function.", "The issue in the previous implementation is that the `__getitem__` method of the\n`StrokeDataset` returns non-tensor objects (nibabel header and affine matrix)\nwhich cannot be batched by PyTorch's DataLoader. The DataLoader's default\ncollate function expects all returned items to be tensors, numpy arrays, or\nbasic Python types that can be stacked into batches.  To fix this, we should\nseparate the data loading logic from the metadata. We'll modify the dataset to\nreturn only tensors during training/validation, and handle the affine/header\ninformation separately during test prediction where we use batch_size=1 and can\nprocess the metadata individually without collation issues.", "The bug occurs because the MRI volumes have different spatial dimensions across\ncases, causing `np.stack()` to fail when trying to stack slices of different\nshapes. The solution is to resize all input volumes to a common target shape\n(e.g., 256x256) before creating the 2.5D stacks. This ensures all slices have\nconsistent dimensions throughout training and inference. We'll use nearest-\nneighbor interpolation for masks and bilinear for images, then resize\npredictions back to original dimensions during test inference.", "The bug occurs because after resizing volumes to a fixed target size (256, 256)\nfor x and y dimensions, the z-axis (slice dimension) is kept at the original\nsize. However, when creating the slice index in the dataset initialization,\nwe're iterating over the original mask shape, but later in `__getitem__` we're\ntrying to access slices from the resized volumes which have different z-axis\nlengths. The fix is to avoid pre-resizing volumes and instead resize them on-\nthe-fly in `__getitem__`, or better yet, load the volumes fresh each time and\ncheck their actual dimensions before accessing slices.", "Looking at the error, the issue is that the dataset pre-loads volume dimensions\nonce during initialization, but then later tries to access slices using those\ndimensions when loading different volumes on-demand in `__getitem__`. This\ncauses an IndexError when a volume has fewer slices than expected.  The fix is\nto load all three modality volumes together in the `__init__` method when\nbuilding the slice index (not just ADC), verify they all have the same shape,\nand use that consistent shape. Alternatively, we can move the slice existence\ncheck to happen during `__getitem__` by loading volumes on-demand but being more\ncareful about the indexing logic.  I'll implement the first approach: load and\nverify all modalities have consistent shapes during initialization, then use\nthose verified dimensions consistently.", "The bug occurs because different MRI modalities (ADC, DWI, FLAIR) have\nmismatched shapes, and when we try to stack slices from different modalities,\nthey have different dimensions. The issue is that we're loading volumes,\nchecking for shape mismatches, but then still trying to extract and stack slices\nwithout ensuring they're all resized to the same dimensions before stacking. The\nfix is to resize each individual 2D slice immediately after extraction and\nnormalization, before attempting to stack them together. This ensures all 9\nchannel slices have identical shapes when we call np.stack()."], "code": ["import os\nimport numpy as np\nimport pandas as pd\nimport nibabel as nib\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torch.utils.data import Dataset, DataLoader\nfrom pathlib import Path\nfrom scipy.ndimage import zoom\nimport random\nfrom tqdm import tqdm\n\n\n# Set seeds for reproducibility\ndef set_seed(seed=42):\n    random.seed(seed)\n    np.random.seed(seed)\n    torch.manual_seed(seed)\n    torch.cuda.manual_seed_all(seed)\n\n\nset_seed(42)\n\n# Paths\nINPUT_DIR = Path(\"./input\")\nWORKING_DIR = Path(\"./working\")\nWORKING_DIR.mkdir(exist_ok=True)\nSUBMISSION_DIR = WORKING_DIR / \"submission\"\nSUBMISSION_DIR.mkdir(exist_ok=True)\nPRED_DIR = SUBMISSION_DIR / \"predictions\"\nPRED_DIR.mkdir(exist_ok=True)\n\nTRAIN_DIR = INPUT_DIR / \"train\"\nTEST_DIR = INPUT_DIR / \"test\"\n\n# Hyperparameters\nPATCH_SIZE = (64, 64, 64)\nBATCH_SIZE = 2\nNUM_EPOCHS = 30\nLEARNING_RATE = 1e-3\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\nprint(f\"Using device: {DEVICE}\")\n\n\n# Dataset\nclass ISLESDataset(Dataset):\n    def __init__(self, case_ids, data_dir, is_train=True, augment=False):\n        self.case_ids = case_ids\n        self.data_dir = data_dir\n        self.is_train = is_train\n        self.augment = augment\n\n    def __len__(self):\n        return len(self.case_ids)\n\n    def load_nifti(self, path):\n        return nib.load(str(path)).get_fdata().astype(np.float32)\n\n    def normalize(self, img):\n        mean = img.mean()\n        std = img.std()\n        if std > 0:\n            return (img - mean) / std\n        return img - mean\n\n    def __getitem__(self, idx):\n        case_id = self.case_ids[idx]\n\n        # Load modalities\n        dwi = self.load_nifti(self.data_dir / f\"{case_id}_dwi.nii.gz\")\n        adc = self.load_nifti(self.data_dir / f\"{case_id}_adc.nii.gz\")\n        flair = self.load_nifti(self.data_dir / f\"{case_id}_flair.nii.gz\")\n\n        # Normalize\n        dwi = self.normalize(dwi)\n        adc = self.normalize(adc)\n        flair = self.normalize(flair)\n\n        # Stack modalities\n        image = np.stack([dwi, adc, flair], axis=0)  # (3, H, W, D)\n\n        if self.is_train:\n            mask = self.load_nifti(self.data_dir / f\"{case_id}_msk.nii.gz\")\n            mask = (mask > 0).astype(np.float32)\n\n            # Random crop for training\n            if self.augment:\n                image, mask = self.random_crop(image, mask, PATCH_SIZE)\n            else:\n                # Center crop\n                image, mask = self.center_crop(image, mask, PATCH_SIZE)\n\n            return torch.from_numpy(image), torch.from_numpy(mask[np.newaxis, ...])\n        else:\n            # For test, return full image\n            return torch.from_numpy(image), image.shape[1:]\n\n    def random_crop(self, image, mask, patch_size):\n        _, h, w, d = image.shape\n        ph, pw, pd = patch_size\n\n        if h > ph:\n            h_start = np.random.randint(0, h - ph)\n        else:\n            h_start = 0\n        if w > pw:\n            w_start = np.random.randint(0, w - pw)\n        else:\n            w_start = 0\n        if d > pd:\n            d_start = np.random.randint(0, d - pd)\n        else:\n            d_start = 0\n\n        image_crop = image[\n            :, h_start : h_start + ph, w_start : w_start + pw, d_start : d_start + pd\n        ]\n        mask_crop = mask[\n            h_start : h_start + ph, w_start : w_start + pw, d_start : d_start + pd\n        ]\n\n        # Pad if necessary\n        image_crop = self.pad_if_needed(image_crop, patch_size)\n        mask_crop = self.pad_if_needed(mask_crop[np.newaxis, ...], patch_size)[0]\n\n        return image_crop, mask_crop\n\n    def center_crop(self, image, mask, patch_size):\n        _, h, w, d = image.shape\n        ph, pw, pd = patch_size\n\n        h_start = max(0, (h - ph) // 2)\n        w_start = max(0, (w - pw) // 2)\n        d_start = max(0, (d - pd) // 2)\n\n        image_crop = image[\n            :, h_start : h_start + ph, w_start : w_start + pw, d_start : d_start + pd\n        ]\n        mask_crop = mask[\n            h_start : h_start + ph, w_start : w_start + pw, d_start : d_start + pd\n        ]\n\n        image_crop = self.pad_if_needed(image_crop, patch_size)\n        mask_crop = self.pad_if_needed(mask_crop[np.newaxis, ...], patch_size)[0]\n\n        return image_crop, mask_crop\n\n    def pad_if_needed(self, array, target_size):\n        if len(array.shape) == 4:\n            c, h, w, d = array.shape\n            ph, pw, pd = target_size\n            pad_h = max(0, ph - h)\n            pad_w = max(0, pw - w)\n            pad_d = max(0, pd - d)\n            if pad_h > 0 or pad_w > 0 or pad_d > 0:\n                array = np.pad(\n                    array, ((0, 0), (0, pad_h), (0, pad_w), (0, pad_d)), mode=\"constant\"\n                )\n            return array[:, :ph, :pw, :pd]\n        else:\n            h, w, d = array.shape\n            ph, pw, pd = target_size\n            pad_h = max(0, ph - h)\n            pad_w = max(0, pw - w)\n            pad_d = max(0, pd - d)\n            if pad_h > 0 or pad_w > 0 or pad_d > 0:\n                array = np.pad(\n                    array, ((0, pad_h), (0, pad_w), (0, pad_d)), mode=\"constant\"\n                )\n            return array[:ph, :pw, :pd]\n\n\n# 3D U-Net Model\nclass UNet3D(nn.Module):\n    def __init__(self, in_channels=3, out_channels=1, init_features=32):\n        super(UNet3D, self).__init__()\n\n        features = init_features\n        self.encoder1 = self._block(in_channels, features)\n        self.pool1 = nn.MaxPool3d(kernel_size=2, stride=2)\n        self.encoder2 = self._block(features, features * 2)\n        self.pool2 = nn.MaxPool3d(kernel_size=2, stride=2)\n        self.encoder3 = self._block(features * 2, features * 4)\n        self.pool3 = nn.MaxPool3d(kernel_size=2, stride=2)\n\n        self.bottleneck = self._block(features * 4, features * 8)\n\n        self.upconv3 = nn.ConvTranspose3d(\n            features * 8, features * 4, kernel_size=2, stride=2\n        )\n        self.decoder3 = self._block((features * 4) * 2, features * 4)\n        self.upconv2 = nn.ConvTranspose3d(\n            features * 4, features * 2, kernel_size=2, stride=2\n        )\n        self.decoder2 = self._block((features * 2) * 2, features * 2)\n        self.upconv1 = nn.ConvTranspose3d(\n            features * 2, features, kernel_size=2, stride=2\n        )\n        self.decoder1 = self._block(features * 2, features)\n\n        self.conv = nn.Conv3d(features, out_channels, kernel_size=1)\n\n    def _block(self, in_channels, features):\n        return nn.Sequential(\n            nn.Conv3d(in_channels, features, kernel_size=3, padding=1),\n            nn.BatchNorm3d(features),\n            nn.ReLU(inplace=True),\n            nn.Conv3d(features, features, kernel_size=3, padding=1),\n            nn.BatchNorm3d(features),\n            nn.ReLU(inplace=True),\n        )\n\n    def forward(self, x):\n        enc1 = self.encoder1(x)\n        enc2 = self.encoder2(self.pool1(enc1))\n        enc3 = self.encoder3(self.pool2(enc2))\n\n        bottleneck = self.bottleneck(self.pool3(enc3))\n\n        dec3 = self.upconv3(bottleneck)\n        dec3 = torch.cat((dec3, enc3), dim=1)\n        dec3 = self.decoder3(dec3)\n        dec2 = self.upconv2(dec3)\n        dec2 = torch.cat((dec2, enc2), dim=1)\n        dec2 = self.decoder2(dec2)\n        dec1 = self.upconv1(dec2)\n        dec1 = torch.cat((dec1, enc1), dim=1)\n        dec1 = self.decoder1(dec1)\n\n        return torch.sigmoid(self.conv(dec1))\n\n\n# Dice Loss\nclass DiceLoss(nn.Module):\n    def __init__(self, smooth=1.0):\n        super(DiceLoss, self).__init__()\n        self.smooth = smooth\n\n    def forward(self, pred, target):\n        pred = pred.contiguous().view(-1)\n        target = target.contiguous().view(-1)\n\n        intersection = (pred * target).sum()\n        dice = (2.0 * intersection + self.smooth) / (\n            pred.sum() + target.sum() + self.smooth\n        )\n\n        return 1 - dice\n\n\n# Dice Score\ndef dice_score(pred, target, threshold=0.5):\n    pred_binary = (pred > threshold).float()\n    target_binary = (target > 0).float()\n\n    intersection = (pred_binary * target_binary).sum()\n    if pred_binary.sum() + target_binary.sum() == 0:\n        return 1.0\n\n    dice = (2.0 * intersection) / (pred_binary.sum() + target_binary.sum())\n    return dice.item()\n\n\n# Get all training cases\ntrain_files = list(TRAIN_DIR.glob(\"*_dwi.nii.gz\"))\ntrain_case_ids = [f.name.replace(\"_dwi.nii.gz\", \"\") for f in train_files]\ntrain_case_ids = sorted(train_case_ids)\n\nprint(f\"Total training cases: {len(train_case_ids)}\")\n\n# Split into train and validation\nnp.random.shuffle(train_case_ids)\nsplit_idx = int(0.8 * len(train_case_ids))\ntrain_ids = train_case_ids[:split_idx]\nval_ids = train_case_ids[split_idx:]\n\nprint(f\"Training cases: {len(train_ids)}\")\nprint(f\"Validation cases: {len(val_ids)}\")\n\n# Create datasets\ntrain_dataset = ISLESDataset(train_ids, TRAIN_DIR, is_train=True, augment=True)\nval_dataset = ISLESDataset(val_ids, TRAIN_DIR, is_train=True, augment=False)\n\ntrain_loader = DataLoader(\n    train_dataset, batch_size=BATCH_SIZE, shuffle=True, num_workers=4\n)\nval_loader = DataLoader(\n    val_dataset, batch_size=BATCH_SIZE, shuffle=False, num_workers=4\n)\n\n# Initialize model\nmodel = UNet3D(in_channels=3, out_channels=1, init_features=32).to(DEVICE)\ncriterion = DiceLoss()\noptimizer = optim.Adam(model.parameters(), lr=LEARNING_RATE)\nscheduler = optim.lr_scheduler.ReduceLROnPlateau(\n    optimizer, mode=\"max\", patience=5, factor=0.5\n)\n\n# Training loop\nbest_val_dice = 0.0\nfor epoch in range(NUM_EPOCHS):\n    model.train()\n    train_loss = 0.0\n\n    for images, masks in tqdm(\n        train_loader, desc=f\"Epoch {epoch+1}/{NUM_EPOCHS} [Train]\"\n    ):\n        images = images.to(DEVICE)\n        masks = masks.to(DEVICE)\n\n        optimizer.zero_grad()\n        outputs = model(images)\n        loss = criterion(outputs, masks)\n        loss.backward()\n        optimizer.step()\n\n        train_loss += loss.item()\n\n    train_loss /= len(train_loader)\n\n    # Validation\n    model.eval()\n    val_loss = 0.0\n    val_dice = 0.0\n\n    with torch.no_grad():\n        for images, masks in tqdm(\n            val_loader, desc=f\"Epoch {epoch+1}/{NUM_EPOCHS} [Val]\"\n        ):\n            images = images.to(DEVICE)\n            masks = masks.to(DEVICE)\n\n            outputs = model(images)\n            loss = criterion(outputs, masks)\n            val_loss += loss.item()\n\n            val_dice += dice_score(outputs, masks)\n\n    val_loss /= len(val_loader)\n    val_dice /= len(val_loader)\n\n    print(\n        f\"Epoch {epoch+1}/{NUM_EPOCHS} - Train Loss: {train_loss:.4f}, Val Loss: {val_loss:.4f}, Val Dice: {val_dice:.4f}\"\n    )\n\n    scheduler.step(val_dice)\n\n    if val_dice > best_val_dice:\n        best_val_dice = val_dice\n        torch.save(model.state_dict(), WORKING_DIR / \"best_model.pth\")\n        print(f\"Best model saved with Val Dice: {best_val_dice:.4f}\")\n\nprint(f\"\\n=== Training Complete ===\")\nprint(f\"Best Validation Dice Score: {best_val_dice:.4f}\")\n\n# Load best model for test predictions\nmodel.load_state_dict(torch.load(WORKING_DIR / \"best_model.pth\"))\nmodel.eval()\n\n# Generate test predictions\ntest_files = list(TEST_DIR.glob(\"*_dwi.nii.gz\"))\ntest_case_ids = [f.name.replace(\"_dwi.nii.gz\", \"\") for f in test_files]\ntest_case_ids = sorted(test_case_ids)\n\nprint(f\"\\nGenerating predictions for {len(test_case_ids)} test cases...\")\n\nsubmission_data = []\n\nfor case_id in tqdm(test_case_ids, desc=\"Test Prediction\"):\n    # Load test data\n    dwi = nib.load(str(TEST_DIR / f\"{case_id}_dwi.nii.gz\"))\n    dwi_data = dwi.get_fdata().astype(np.float32)\n    adc_data = (\n        nib.load(str(TEST_DIR / f\"{case_id}_adc.nii.gz\")).get_fdata().astype(np.float32)\n    )\n    flair_data = (\n        nib.load(str(TEST_DIR / f\"{case_id}_flair.nii.gz\"))\n        .get_fdata()\n        .astype(np.float32)\n    )\n\n    # Normalize\n    dwi_data = (dwi_data - dwi_data.mean()) / (dwi_data.std() + 1e-8)\n    adc_data = (adc_data - adc_data.mean()) / (adc_data.std() + 1e-8)\n    flair_data = (flair_data - flair_data.mean()) / (flair_data.std() + 1e-8)\n\n    # Stack\n    image = np.stack([dwi_data, adc_data, flair_data], axis=0)\n    original_shape = image.shape[1:]\n\n    # Resize to patch size for inference\n    zoom_factors = [PATCH_SIZE[i] / original_shape[i] for i in range(3)]\n    image_resized = zoom(image, [1] + zoom_factors, order=1)\n\n    # Predict\n    with torch.no_grad():\n        image_tensor = torch.from_numpy(image_resized[np.newaxis, ...]).to(DEVICE)\n        output = model(image_tensor)\n        pred_mask = output.squeeze().cpu().numpy()\n\n    # Resize back to original shape\n    zoom_factors_back = [original_shape[i] / PATCH_SIZE[i] for i in range(3)]\n    pred_mask = zoom(pred_mask, zoom_factors_back, order=1)\n    pred_mask = (pred_mask > 0.5).astype(np.uint8)\n\n    # Save prediction\n    pred_nii = nib.Nifti1Image(pred_mask, dwi.affine, dwi.header)\n    pred_path = PRED_DIR / f\"{case_id}_pred.nii.gz\"\n    nib.save(pred_nii, str(pred_path))\n\n    submission_data.append(\n        {\n            \"case_id\": case_id,\n            \"predicted_mask_path\": f\"predictions/{case_id}_pred.nii.gz\",\n        }\n    )\n\n# Save submission CSV\nsubmission_df = pd.DataFrame(submission_data)\nsubmission_df.to_csv(SUBMISSION_DIR / \"submission.csv\", index=False)\n\nprint(f\"\\n=== Submission Complete ===\")\nprint(f'Submission saved to: {SUBMISSION_DIR / \"submission.csv\"}')\nprint(f\"Predictions saved to: {PRED_DIR}\")\nprint(f\"\\nFina Encoder\n        self.enc1 = ConvBlock(in_channels, 32)\n        self.pool1 = nn.MaxPool3d(2)\n\n        self.enc2 = ConvBlock(32, 64)\n        self.pool2 = nn.MaxPool3d(2)\n\n        self.enc3 = ConvBlock(64, 128)\n        self.pool3 = nn.MaxPool3d(2)\n\n        # Bottleneck\n        self.bottleneck = ConvBlock(128, 256)\n\n        # Decoder\n        self.upconv3 = nn.ConvTranspose3d(256, 128, 2, stride=2)\n        self.dec3 = ConvBlock(256, 128)\n\n        self.upconv2 = nn.ConvTranspose3d(128, 64, 2, stride=2)\n        self.dec2 = ConvBlock(128, 64)\n\n        self.upconv1 = nn.ConvTranspose3d(64, 32, 2, stride=2)\n        self.dec1 = ConvBlock(64, 32)\n\n        self.out = nn.Conv3d(32, out_channels, 1)\n\n    def forward(self, x):\n        # Encoder\n        e1 = self.enc1(x)\n        p1 = self.pool1(e1)\n\n        e2 = self.enc2(p1)\n        p2 = self.pool2(e2)\n\n        e3 = self.enc3(p2)\n        p3 = self.pool3(e3)\n\n        # Bottleneck\n        b = self.bottleneck(p3)\n\n        # Decoder with skip connections\n        d3 = self.upconv3(b)\n        d3 = torch.cat([d3, e3], dim=1)\n        d3 = self.dec3(d3)\n\n        d2 = self.upconv2(d3)\n        d2 = torch.cat([d2, e2], dim=1)\n        d2 = self.dec2(d2)\n\n        d1 = self.upconv1(d2)\n        d1 = torch.cat([d1, e1], dim=1)\n        d1 = self.dec1(d1)\n\n        out = self.out(d1)\n        return out\n\n\n# Dataset\nclass StrokeDataset(Dataset):\n    def __init__(self, case_ids, data_dir, is_test=False, augment=False):\n        self.case_ids = case_ids\n        self.data_dir = data_dir\n        self.is_test = is_test\n        self.augment = augment\n\n    def __len__(self):\n        return len(self.case_ids)\n\n    def load_and_preprocess(self, filepath):\n        nii = nib.load(str(filepath))\n        data = nii.get_fdata()\n\n        # Normalize\n        if data.max() > 0:\n            data = (data - data.mean()) / (data.std() + 1e-8)\n\n        # Resize\n        from scipy.ndimage import zoom\n\n        zoom_factors = [t / s for t, s in zip(TARGET_SIZE, data.shape)]\n        data = zoom(data, zoom_factors, order=1)\n\n        return data, nii.affine, nii.header, data.shape\n\n    def __getitem__(self, idx):\n        case_id = self.case_ids[idx]\n\n        # Load modalities\n        dwi, affine, header, orig_shape = self.load_and_preprocess(\n            self.data_dir / f\"{case_id}_dwi.nii.gz\"\n        )\n        adc, _, _, _ = self.load_and_preprocess(self.data_dir / f\"{case_id}_adc.nii.gz\")\n        flair, _, _, _ = self.load_and_preprocess(\n            self.data_dir / f\"{case_id}_flair.nii.gz\"\n        )\n\n        # Stack modalities\n        image = np.stack([dwi, adc, flair], axis=0).astype(np.float32)\n\n        # Data augmentation\n        if self.augment and not self.is_test:\n            if np.random.rand() > 0.5:\n                image = np.flip(image, axis=1).copy()\n\n        if not self.is_test:\n            # Load mask\n            mask_path = self.data_dir / f\"{case_id}_msk.nii.gz\"\n            mask_nii = nib.load(str(mask_path))\n            mask = mask_nii.get_fdata()\n\n            # Resize mask\n            from scipy.ndimage import zoom\n\n            zoom_factors = [t / s for t, s in zip(TARGET_SIZE, mask.shape)]\n            mask = zoom(mask, zoom_factors, order=0)\n            mask = (mask > 0).astype(np.float32)\n\n            if self.augment:\n                if np.random.rand() > 0.5:\n                    mask = np.flip(mask, axis=0).copy()\n\n            mask = mask[np.newaxis, ...]\n\n            return (\n                torch.from_numpy(image),\n                torch.from_numpy(mask),\n                case_id,\n                affine,\n                header,\n                orig_shape,\n            )\n        else:\n            return torch.from_numpy(image), case_id, affine, header, orig_shape\n\n\n# Dice Loss\nclass DiceLoss(nn.Module):\n    def __init__(self, smooth=1.0):\n        super().__init__()\n        self lits=N_FOLDS, shuffle=True, random_state=42)\nfold_scores = []\n\nprint(\"\\n\" + \"=\" * 50)\nprint(\"Starting 5-Fold Cross-Validation\")\nprint(\"=\" * 50)\n\nbest_models = []\n\nfor fold, (train_idx, val_idx) in enumerate(kfold.split(case_ids)):\n    print(f\"\\nFold {fold + 1}/{N_FOLDS}\")\n    print(\"-\" * 50)\n\n    train_cases = [case_ids[i] for i in train_idx]\n    val_cases = [case_ids[i] for i in val_idx]\n\n    train_dataset = StrokeDataset(train_cases, TRAIN_DIR, augment=True)\n    val_dataset = StrokeDataset(val_cases, TRAIN_DIR, augment=False)\n\n    train_loader = DataLoader(\n        train_dataset, batch_size=BATCH_SIZE, shuffle=True, num_workers=2\n    )\n    val_loader = DataLoader(\n        val_dataset, batch_size=BATCH_SIZE, shuffle=False, num_workers=2\n    )\n\n    model = UNet3D(in_channels=3, out_channels=1).to(device)\n    criterion = DiceLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=LEARNING_RATE)\n    scheduler = torch.optim.lr_scheduler.ReduceLROnPlateau(\n        optimizer, mode=\"max\", patience=5, factor=0.5\n    )\n    scaler = GradScaler()\n\n    best_dice = 0\n    patience_counter = 0\n    max_patience = 10\n\n    for epoch in range(NUM_EPOCHS):\n        train_loss, train_dice = train_epoch(\n            model, train_loader, criterion, optimizer, scaler\n        )\n        val_loss, val_dice = validate(model, val_loader, criterion)\n\n        scheduler.step(val_dice)\n\n        if (epoch + 1) % 5 == 0:\n            print(\n                f\"Epoch {epoch+1}/{NUM_EPOCHS} - Train Loss: {train_loss:.4f}, Train Dice: {train_dice:.4f}, Val Loss: {val_loss:.4f}, Val Dice: {val_dice:.4f}\"\n            )\n\n        if val_dice > best_dice:\n            best_dice = val_dice\n            patience_counter = 0\n            # Save best model for this fold\n            torch.save(model.state_dict(), WORKING_DIR / f\"best_model_fold{fold}.pth\")\n        else:\n            patience_counter += 1\n\n        if patience_counter >= t__()\n        self.conv1 = nn.Conv3d(in_channels, out_channels, 3, padding=1)\n        self.bn1 = nn.BatchNorm3d(out_channels)\n        self.conv2 = nn.Conv3d(out_channels, out_channels, 3, padding=1)\n        self.bn2 = nn.BatchNorm3d(out_channels)\n        self.relu = nn.ReLU(inplace=True)\n\n    def forward(self, x):\n        x = self.relu(self.bn1(self.conv1(x)))\n        x = self.relu(self.bn2(self.conv2(x)))\n        return x\n\n\nclass UNet3D(nn.Module):\n    def __init__(self, in_channels=3, out_channels=1, init_features=32):\n        super().__init__()\n\n        features = init_features\n        self.encoder1 = ConvBlock(in_channels, features)\n        self.pool1 = nn.MaxPool3d(2, 2)\n\n        self.encoder2 = ConvBlock(features, features * 2)\n        self.pool2 = nn.MaxPool3d(2, 2)\n\n        self.encoder3 = ConvBlock(features * 2, features * 4)\n        self.pool3 = nn.MaxPool3d(2, 2)\n\n        self.bottleneck = ConvBlock(features * 4, features * 8)\n\n        self.upconv3 = nn.ConvTranspose3d(features * 8, features * 4, 2, stride=2)\n        self.decoder3 = ConvBlock(features * 8, features * 4)\n\n        self.upconv2 = nn.ConvTranspose3d(features * 4, features * 2, 2, stride=2)\n        self.decoder2 = ConvBlock(features * 4, features * 2)\n\n        self.upconv1 = nn.ConvTranspose3d(features * 2, features, 2, stride=2)\n        self.decoder1 = ConvBlock(features * 2, features)\n\n        self.conv_out = nn.Conv3d(features, out_channels, 1)\n\n    def forward(self, x):\n        enc1 = self.encoder1(x)\n        enc2 = self.encoder2(self.pool1(enc1))\n        enc3 = self.encoder3(self.pool2(enc2))\n\n        bottleneck = self.bottleneck(self.pool3(enc3))\n\n        dec3 = self.upconv3(bottleneck)\n        dec3 = torch.cat([dec3, enc3], dim=1)\n        dec3 = self.decoder3(dec3)\n\n        dec2 = self.upconv2(dec3)\n        dec2 = torch.cat([dec2, enc2], dim=1)\n        dec2 = self.decoder2(dec2)\n\n        dec1 = self.upconv1(dec2)\n        dec1 = torch.cat([dec1, enc1], dim=1)\n        dec1 = self.decoder1(dec1)\n\n        return self.conv_out(dec1)\n\n\n# Dataset\nclass StrokeDataset(Dataset):\n    def __init__(self, case_ids, data_dir, train=True, target_shape=(128, 128, 64)):\n        self.case_ids = case_ids\n        self.data_dir = Path(data_dir)\n        self.train = train\n        self.target_shape = target_shape\n\n    def __len__(self):\n        return len(self.case_ids)\n\n    def normalize(self, img):\n        img = img.astype(np.float32)\n        if img.max() > 0:\n            img = (img - img.mean()) / (img.std() + 1e-8)\n        return img\n\n    def resize_volume(self, volume, target_shape):\n        factors = [t / s for t, s in zip(target_shape, volume.shape)]\n        return zoom(volume, factors, order=1)\n\n    def __getitem__(self, idx):\n        case_id = self.case_ids[idx]\n\n        # Load modalities\n        dwi = nib.load(self.data_dir / f\"{case_id}_dwi.nii.gz\").get_fdata()\n        adc = nib.load(self.data_dir / f\"{case_id}_adc.nii.gz\").get_fdata()\n        flair = nib.load(self.data_dir / f\"{case_id}_flair.nii.gz\").get_fdata()\n\n        # Resize\n        dwi = self.resize_volume(dwi, self.target_shape)\n        adc = self.resize_volume(adc, self.target_shape)\n        flair = self.resize_volume(flair, self.target_shape)\n\n        # Normalize\n        dwi = self.normalize(dwi)\n        adc = self.normalize(adc)\n        flair = self.normalize(flair)\n\n        # Stack modalities\n        image = np.stack([dwi, adc, flair], axis=0)\n\n        if self.train:\n            mask = nib.load(self.data_dir / f\"{case_id}_msk.nii.gz\").get_fdata()\n            mask = self.resize_volume(mask, self.target_shape)\n            mask = (mask > 0).astype(np.float32)\n            mask = np.expand_dims(mask, axis=0)\n            return torch.from_numpy(image), torch.from_numpy(mask)\n        else:\n            return torch.from_numpy(image), case_id\n\n\n# Dice Loss\nclass DiceLoss(nn.Module):\n    def __init__(self, smooth=1.0):\n        super().__init__()\n        self.smooth = smooth\n\n    def forward(self, pred, target):\n        pred = torch.sigmoid(pred)\n        pred = pred.contiguous().view(-1)\n        target = target.contiguous().view(-1)\n\n        intersection = (pred * target).sum()\n        dice = (2.0 * intersection + self.smooth) / (\n            pred.sum() + target.sum() + self.smooth\n        )\n        return 1 - dice\n\n\n# Combined Loss\nclass CombinedLoss(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.dice_loss = DiceLoss()\n        self.bce_loss = nn.BCEWithLogitsLoss()\n\n    def forward(self, pred, target):\n        return self.dice_loss(pred, target) + self.bce_loss(pred, target)\n\n\n# Dice metric\ndef compute_dice(pred, target, threshold=0.5):\n    pred = (torch.sigmoid(pred) > threshold).float()\n    intersection = (pred * target).sum()\n    union = pred.sum() + target.sum()\n    if union == 0:\n        return 1.0\n    return (2.0 * intersection / union).item()\n\n\n# Training function\ndef train_epoch(model, loader, optimizer, criterion, device):\n    model.train()\n    total_loss = 0\n    total_dice = 0\n\n    for images, masks in loader:\n        images = images.to(device)\n        masks = masks.to(device)\n\n        optimizer.zero_grad()\n        outputs = model(images)\n        loss = criterion(outputs, masks)\n        loss.backward()\n        optimizer.step()\n\n        total_loss += loss.item()\n        total_dice += compute_dice(outputs, masks)\n\n    return total_loss / len(loader), total_dice / len(loader)\n\n\n# Validation function\ndef validate(model, loader, criterion, device):\n    model.eval()\n    total_loss = 0\n    total_dice = 0\n\n    with torch.no_grad():\n        for images, masks in loader:\n            images = images.to(device)\n            masks = masks.to(device)\n\n            outputs = model(images)\n            loss = criterion(outputs, masks)\n\n            total_loss += loss.item()\n            total_dice += compute_dice(outputs, masks)\n\n    return total_loss / len(loader), total_dice / len(loader)\n\n\n# Get all training case IDs\ntrain_files = sorted(glob.glob(str(train_dir / \"*_msk.nii.gz\")))\ntrain_case_ids = [Path(f).name.replace(\"_msk.nii.gz\", \"\") for f in train_files]\nprint(f\"Found {len(train_case_ids)} training cases\")\n\n# 5-Fold Cross Validation\nkfold = KFold(n_splits=5, shuffle=True, random_state=42)\nfold_dice_scores = []\n\nfor fold, (train_idx, val_idx) in enumerate(kfold.split(train_case_ids)):\n    print(f\"\\n{'='*50}\")\n    print(f\"Fold {fold + 1}/5\")\n    print(f\"{'='*50}\")\n\n    train_ids = [train_case_ids[i] for i in train_idx]\n    val_ids = [train_case_ids[i] for i in val_idx]\n\n    train_dataset = StrokeDataset(train_ids, train_dir, train=True)\n    val_dataset = StrokeDataset(val_ids, train_dir, train=True)\n\n    train_loader = DataLoader(train_dataset, batch_size=2, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_dataset, batch_size=2, shuffle=False, num_workers=4)\n\n    model = UNet3D(in_channels=3, out_channels=1, init_features=32).to(device)\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\n    criterion = CombinedLoss()\n    scheduler = torch.optim.lr_scheduler.ReduceLROnPlateau(\n        optimizer, mode=\"max\", patience=3, factor=0.5\n    )\n\n    best_dice = 0\n    epochs = 15\n\n    for epoch in range(epochs):\n        train_loss, train_dice = train_epoch(\n            model, train_loader, optimizer, criterion, device\n        )\n        val_loss, val_dice = validate(model, val_loader, criterion, device)\n\n        scheduler.step(val_dice)\n\n        print(\n            f\"Epoch {epoch+1}/{epochs} - Train Loss: {train_loss:.4f}, Train Dice: {train_dice:.4f}, \"\n            f\"Val Loss: {val_loss:.4f}, Val Dice: {val_dice:.4f}\"\n        )\n\n        if val_dice > best_dice:\n            best_dice = val_dice\n            torch.save(model.state_dict(), output_dir / f\"best_model_fold{fold}.pth\")\n\n    fold_dice_scores.append(best_dice)\n    print(f\"Fold {fold + 1} Best Dice: {best_dice:.4f}\")\n\n# Print CV results\nmean_dice = np.mean(fold_dice_scores)\nstd_dice = np.std(fold_dice_scores)\nprint(f\"\\n{'='*50}\")\nprint(f\"5-Fold Cross-Validation Results\")\nprint(f\"{'='*50}\")\nprint(f\"Fold Dice Scores: {[f'{d:.4f}' for d in fold_dice_scores]}\")\nprint(f\"Mean Dice Score: {mean_dice:.4f} \u00b1 {std_dice:.4f}\")\n\n# Train final model on all training data for test predictions\nprint(f\"\\n{'='*50}\")\nprint(\"Training final model on all training data\")\nprint(f\"{'='*50}\")\n\ntrain_dataset = StrokeDataset(train_case_ids, train_dir, train=True)\ntrain_loader = DataLoader(train_dataset, batch_size=2, shuffle=True, num_workers=4)\n\nmodel = UNet3D(in_channels=3, out_channels=1, init_features=32).to(device)\noptimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\ncriterion = CombinedLoss()\n\nfor epoch in range(20):\n    train_loss, train_dice = train_epoch(\n        model, train_loader, optimizer, criterion, device\n    )\n    print(\n        f\"Epoch {epoch+1}/20 - Train Loss: {train_loss:.4f}, Train Dice: {train_dice:.4f}\"\n    )\n\n# Generate test predictions\nprint(f\"\\n{'='*50}\")\nprint(\"Generating test predictions\")\nprint(f\"{'='*50}\")\n\ntest_files = sorted(glob.glob(str(test_dir / \"*_dwi.nii.gz\")))\ntest_case_ids = [Path(f).name.replace(\"_dwi.nii.gz\", \"\") for f in test_files]\nprint(f\"Found {len(test_case_ids)} test cases\")\n\ntest_dataset = StrokeDataset(test_case_ids, test_dir, train=False)\ntest_loader = DataLoader(test_dataset, batch_size=1, shuffle=False, num_workers=4)\n\nmodel.eval()\nsubmission_data = []\n\nwith torch.no_grad():\n    for images, case_id in test_loader:\n        images = images.to(device)\n        outputs = model(images)\n        pred_mask = torch.sigmoid(outputs) > 0.5\n        pred_mask = pred_mask.cpu().numpy()[0, 0]\n\n        # Load original shape\n        original_dwi = nib.load(test_dir / f\"{case_id[0]}_dwi.nii.gz\")\n        original_shape = original_dwi.shape\n        original_affine = original_dwi.affine\n\n        # Resize prediction back to original shape\n        factors = [s / t for s, t in zip(original_shape, pred_mask.shape)]\n        pred_mask_full = zoom(pred_mask.astype(np.float32), factors, order=0)\n        pred_mask_full = pred_mask_full.astype(np.uint8)\n\n        # Save prediction\n        pred_nii = nib.Nifti1Image(pred_mask_full, original_affine)\n        pred_path = submission_dir / f\"{case_id[0]}_pred.nii.gz\"\n        nib.save(pred_nii, pred_path)\n\n        submission_data.append(\n            {\n                \"case_id\": case_id[0],\n                \"predicted_mask_path\": f\"predictions/{case_id[0]}_pred.nii.gz\",\n            }\n        )\n\n# Save submission CSV\nsubmission_df = pd.DataFrame(submission_data)\nsubmission_df.to_csv(output_dir / \"submission.csv\", index=False)\nprint(f\"\\nSubmission saved to {output_dir / 'submission.csv'}\")\nprint(f\"Total test predictions: {len(submission_data)}\")", "import os\nimport numpy as np\nimport pandas as pd\nimport nibabel as nib\nfrom pathlib import Path\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nfrom torch.utils.data import Dataset, DataLoader\nfrom sklearn.model_selection import KFold\nimport warnings\n\nwarnings.filterwarnings(\"ignore\")\n\n# Set random seeds\nnp.random.seed(42)\ntorch.manual_seed(42)\nif torch.cuda.is_available():\n    torch.cuda.manual_seed(42)\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\n# Paths\nINPUT_DIR = Path(\"./input\")\nTRAIN_DIR = INPUT_DIR / \"train\"\nTEST_DIR = INPUT_DIR / \"test\"\nWORKING_DIR = Path(\"./working\")\nWORKING_DIR.mkdir(exist_ok=True)\n\n# Get training cases\ntrain_cases = sorted(\n    list(set([f.name.split(\"_\")[0] for f in TRAIN_DIR.glob(\"*.nii.gz\")]))\n)\nprint(f\"Found {len(train_cases)} training cases\")\n\n# Get test cases\ntest_cases = sorted(\n    list(set([f.name.split(\"_\")[0] for f in TEST_DIR.glob(\"*.nii.gz\")]))\n)\nprint(f\"Found {len(test_cases)} test cases\")\n\n\ndef load_case(case_dir, case_id, load_mask=True):\n    \"\"\"Load multimodal MRI and mask for a case\"\"\"\n    dwi = nib.load(case_dir / f\"{case_id}_dwi.nii.gz\").get_fdata()\n    adc = nib.load(case_dir / f\"{case_id}_adc.nii.gz\").get_fdata()\n    flair = nib.load(case_dir / f\"{case_id}_flair.nii.gz\").get_fdata()\n\n    # Stack modalities as channels\n    image = np.stack([dwi, adc, flair], axis=0)  # (3, D, H, W)\n\n    mask = None\n    if load_mask:\n        mask_path = case_dir / f\"{case_id}_msk.nii.gz\"\n        if mask_path.exists():\n            mask = nib.load(mask_path).get_fdata()\n\n    return image, mask\n\n\ndef normalize_image(image):\n    \"\"\"Normalize each modality independently\"\"\"\n    normalized = np.zeros_like(image)\n    for i in range(image.shape[0]):\n        channel = image[i]\n        # Percentile-based normalization\n        p1, p99 = np.percentile(channel[channel > 0], [1, 99])\n        channel = np.clip(channel, p1, p99)\n        if p99 - p1 > 0:\n            channel = (channel - p1) / (p99 - p1)\n        normalized[i] = channel\n    return normalized\n\n\nclass SliceDataset(Dataset):\n    \"\"\"Dataset for 2D slices from 3D volumes\"\"\"\n\n    def __init__(self, case_ids, case_dir, axis=0, load_mask=True):\n        self.case_ids = case_ids\n        self.case_dir = case_dir\n        self.axis = axis  # 0: axial, 1: sagittal, 2: coronal\n        self.load_mask = load_mask\n        self.slices = []\n\n        # Build slice index\n        for case_id in case_ids:\n            image, mask = load_case(case_dir, case_id, load_mask)\n            image = normalize_image(image)\n\n            # Get number of slices along the axis\n            num_slices = image.shape[1 + axis]  # +1 because first dim is channels\n\n            # Only include slices with lesions or sample negatives\n            for slice_idx in range(num_slices):\n                if load_mask and mask is not None:\n                    # Extract slice from mask\n                    if axis == 0:\n                        mask_slice = mask[slice_idx, :, :]\n                    elif axis == 1:\n                        mask_slice = mask[:, slice_idx, :]\n                    else:\n                        mask_slice = mask[:, :, slice_idx]\n\n                    # Include all positive slices and sample 20% of negative slices\n                    if mask_slice.sum() > 0 or np.random.rand() < 0.2:\n                        self.slices.append((case_id, slice_idx, image, mask))\n                else:\n                    self.slices.append((case_id, slice_idx, image, None))\n\n        print(f\"Created dataset with {len(self.slices)} slices (axis={axis})\")\n\n    def __len__(self):\n        return len(self.slices)\n\n    def __getitem__(self, idx):\n        case_id, slice_idx, image, mask = self.slices[idx]\n\n        # Extract 2D slice\n        if self.axis == 0:\n            image_slice = image[:, slice_idx, :, :]  # (3, H, W)\n            mask_slice = mask[slice_idx, :, :] if mask is not None else None\n        elif self.axis == 1:\n            image_slice = image[:, :, slice_idx, :]  # (3, D, W)\n            mask_slice = mask[:, slice_idx, :] if mask is not None else None\n        else:\n            image_slice = image[:, :, :, slice_idx]  # (3, D, H)\n            mask_slice = mask[:, :, slice_idx] if mask is not None else None\n\n        # Resize to fixed size\n        target_size = (256, 256)\n        image_slice = torch.from_numpy(image_slice).float()\n        image_slice = F.interpolate(\n            image_slice.unsqueeze(0),\n            size=target_size,\n            mode=\"bilinear\",\n            align_corners=False,\n        ).squeeze(0)\n\n        if mask_slice is not None:\n            mask_slice = torch.from_numpy(mask_slice).float().unsqueeze(0)\n            mask_slice = F.interpolate(\n                mask_slice.unsqueeze(0), size=target_size, mode=\"nearest\"\n            ).squeeze(0)\n            return image_slice, mask_slice, (case_id, slice_idx)\n        else:\n            return image_slice, (case_id, slice_idx)\n\n\nclass UNet2D(nn.Module):\n    \"\"\"2D U-Net for slice segmentation\"\"\"\n\n    def __init__(self, in_channels=3, out_channels=1, features=[64, 128, 256, 512]):\n        super(UNet2D, self).__init__()\n\n        self.encoder = nn.ModuleList()\n        self.decoder = nn.ModuleList()\n        self.pool = nn.MaxPool2d(kernel_size=2, stride=2)\n\n        # Encoder\n        for feature in features:\n            self.encoder.append(self._block(in_channels, feature))\n            in_channels = feature\n\n        # Bottleneck\n        self.bottleneck = self._block(features[-1], features[-1] * 2)\n\n        # Decoder\n        for feature in reversed(features):\n            self.decoder.append(\n                nn.ConvTranspose2d(feature * 2, feature, kernel_size=2, stride=2)\n            )\n            self.decoder.append(self._block(feature * 2, feature))\n\n        self.final_conv = nn.Conv2d(features[0], out_channels, kernel_size=1)\n\n    def _block(self, in_channels, out_channels):\n        return nn.Sequential(\n            nn.Conv2d(in_channels, out_channels, kernel_size=3, padding=1, bias=False),\n            nn.BatchNorm2d(out_channels),\n            nn.ReLU(inplace=True),\n            nn.Conv2d(out_channels, out_channels, kernel_size=3, padding=1, bias=False),\n            nn.BatchNorm2d(out_channels),\n            nn.ReLU(inplace=True),\n        )\n\n    def forward(self, x):\n        skip_connections = []\n\n        # Encoder\n        for layer in self.encoder:\n            x = layer(x)\n            skip_connections.append(x)\n            x = self.pool(x)\n\n        # Bottleneck\n        x = self.bottleneck(x)\n        skip_connections = skip_connections[::-1]\n\n        # Decoder\n        for idx in range(0, len(self.decoder), 2):\n            x = self.decoder[idx](x)\n            skip = skip_connections[idx // 2]\n\n            if x.shape != skip.shape:\n                x = F.interpolate(\n                    x, size=skip.shape[2:], mode=\"bilinear\", align_corners=False\n                )\n\n            x = torch.cat([skip, x], dim=1)\n            x = self.decoder[idx + 1](x)\n\n        return torch.sigmoid(self.final_conv(x))\n\n\ndef dice_coefficient(pred, target, smooth=1e-6):\n    \"\"\"Compute Dice coefficient\"\"\"\n    pred = pred.view(-1)\n    target = target.view(-1)\n    intersection = (pred * target).sum()\n    return (2.0 * intersection + smooth) / (pred.sum() + target.sum() + smooth)\n\n\ndef dice_loss(pred, target, smooth=1e-6):\n    \"\"\"Dice loss\"\"\"\n    return 1 - dice_coefficient(pred, target, smooth)\n\n\ndef train_model(model, train_loader, val_loader, num_epochs=15):\n    \"\"\"Train the model\"\"\"\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\n    scheduler = torch.optim.lr_scheduler.ReduceLROnPlateau(\n        optimizer, mode=\"max\", factor=0.5, patience=3, verbose=True\n    )\n\n    best_dice = 0\n    best_model_state = None\n\n    for epoch in range(num_epochs):\n        # Training\n        model.train()\n        train_loss = 0\n        train_dice = 0\n\n        for batch_idx, (images, masks, _) in enumerate(train_loader):\n            images = images.to(device)\n            masks = masks.to(device)\n\n            optimizer.zero_grad()\n            outputs = model(images)\n\n            loss = dice_loss(outputs, masks)\n            loss.backward()\n            optimizer.step()\n\n            train_loss += loss.item()\n            train_dice += dice_coefficient(outputs > 0.5, masks).item()\n\n        train_loss /= len(train_loader)\n        train_dice /= len(train_loader)\n\n        # Validation\n        model.eval()\n        val_dice = 0\n\n        with torch.no_grad():\n            for images, masks, _ in val_loader:\n                images = images.to(device)\n                masks = masks.to(device)\n\n                outputs = model(images)\n                val_dice += dice_coefficient(outputs > 0.5, masks).item()\n\n        val_dice /= len(val_loader)\n\n        print(\n            f\"Epoch {epoch+1}/{num_epochs} - Train Loss: {train_loss:.4f}, Train Dice: {train_dice:.4f}, Val Dice: {val_dice:.4f}\"\n        )\n\n        scheduler.step(val_dice)\n\n        if val_dice > best_dice:\n            best_dice = val_dice\n            best_model_state = model.state_dict().copy()\n\n    if best_model_state is not None:\n        model.load_state_dict(best_model_state)\n\n    return best_dice\n\n\ndef predict_case(model, case_dir, case_id, axis=0):\n    \"\"\"Predict mask for a single case\"\"\"\n    image, _ = load_case(case_dir, case_id, load_mask=False)\n    image = normalize_image(image)\n    original_shape = image.shape[1:]  # (D, H, W)\n\n    # Get number of slices\n    num_slices = image.shape[1 + axis]\n\n    # Initialize prediction volume\n    if axis == 0:\n        pred_shape = original_shape\n    elif axis == 1:\n        pred_shape = original_shape\n    else:\n        pred_shape = original_shape\n\n    pred_volume = np.zeros(pred_shape, dtype=np.float32)\n\n    model.eval()\n    with torch.no_grad():\n        for slice_idx in range(num_slices):\n            # Extract slice\n            if axis == 0:\n                image_slice = image[:, slice_idx, :, :]\n            elif axis == 1:\n                image_slice = image[:, :, slice_idx, :]\n            else:\n                image_slice = image[:, :, :, slice_idx]\n\n            # Prepare input\n            image_slice = torch.from_numpy(image_slice).float().unsqueeze(0).to(device)\n            image_slice = F.interpolate(\n                image_slice, size=(256, 256), mode=\"bilinear\", align_corners=False\n            )\n\n            # Predict\n            output = model(image_slice).squeeze().cpu().numpy()\n\n            # Resize back to original size\n            if axis == 0:\n                output_resized = (\n                    F.interpolate(\n                        torch.from_numpy(output).unsqueeze(0).unsqueeze(0),\n                        size=(original_shape[1], original_shape[2]),\n                        mode=\"bilinear\",\n                        align_corners=False,\n                    )\n                    .squeeze()\n                    .numpy()\n                )\n                pred_volume[slice_idx, :, :] = output_resized\n            elif axis == 1:\n                output_resized = (\n                    F.interpolate(\n                        torch.from_numpy(output).unsqueeze(0).unsqueeze(0),\n                        size=(original_shape[0], original_shape[2]),\n                        mode=\"bilinear\",\n                        align_corners=False,\n                    )\n                    .squeeze()\n                    .numpy()\n                )\n                pred_volume[:, slice_idx, :] = output_resized\n            else:\n                output_resized = (\n                    F.interpolate(\n                        torch.from_numpy(output).unsqueeze(0).unsqueeze(0),\n                        size=(original_shape[0], original_shape[1]),\n                        mode=\"bilinear\",\n                        align_corners=False,\n                    )\n                    .squeeze()\n                    .numpy()\n                )\n                pred_volume[:, :, slice_idx] = output_resized\n\n    return pred_volume\n\n\n# Cross-validation with single axis (axial - axis 0) due to time constraints\nprint(\"\\n=== Starting 5-Fold Cross-Validation (Axial View) ===\")\nkfold = KFold(n_splits=5, shuffle=True, random_state=42)\nfold_scores = []\n\nfor fold, (train_idx, val_idx) in enumerate(kfold.split(train_cases)):\n    print(f\"\\n--- Fold {fold + 1}/5 ---\")\n\n    train_fold_cases = [train_cases[i] for i in train_idx]\n    val_fold_cases = [train_cases[i] for i in val_idx]\n\n    # Create datasets\n    train_dataset = SliceDataset(train_fold_cases, TRAIN_DIR, axis=0, load_mask=True)\n    val_dataset = SliceDataset(val_fold_cases, TRAIN_DIR, axis=0, load_mask=True)\n\n    train_loader = DataLoader(train_dataset, batch_size=16, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_dataset, batch_size=16, shuffle=False, num_workers=4)\n\n    # Train model\n    model = UNet2D(in_channels=3, out_channels=1).to(device)\n    best_dice = train_model(model, train_loader, val_loader, num_epochs=10)\n\n    fold_scores.append(best_dice)\n    print(f\"Fold {fold + 1} Best Dice: {best_dice:.4f}\")\n\n    # Clean up\n    del model, train_dataset, val_dataset, train_loader, val_loader\n    torch.cuda.empty_cache()\n\nmean_dice = np.mean(fold_scores)\nstd_dice = np.std(fold_scores)\nprint(f\"\\n=== Cross-Validation Results ===\")\nprint(f\"Mean Dice Score: {mean_dice:.4f} \u00b1 {std_dice:.4f}\")\nprint(f\"Fold Scores: {[f'{s:.4f}' for s in fold_scores]}\")\n\n# Train final model on all training data\nprint(\"\\n=== Training Final Model on All Data ===\")\nfull_train_dataset = SliceDataset(train_cases, TRAIN_DIR, axis=0, load_mask=True)\nfull_train_loader = DataLoader(\n    full_train_dataset, batch_size=16, shuffle=True, num_workers=4\n)\n\n# Create a small validation set for monitoring\nval_split = int(0.9 * len(train_cases))\nfinal_train_cases = train_cases[:val_split]\nfinal_val_cases = train_cases[val_split:]\n\nfinal_train_dataset = SliceDataset(final_train_cases, TRAIN_DIR, axis=0, load_mask=True)\nfinal_val_dataset = SliceDataset(final_val_cases, TRAIN_DIR, axis=0, load_mask=True)\n\nfinal_train_loader = DataLoader(\n    final_train_dataset, batch_size=16, shuffle=True, num_workers=4\n)\nfinal_val_loader = DataLoader(\n    final_val_dataset, batch_size=16, shuffle=False, num_workers=4\n)\n\nfinal_model = UNet2D(in_channels=3, out_channels=1).to(device)\ntrain_model(final_model, final_train_loader, final_val_loader, num_epochs=15)\n\n# Generate test predictions\nprint(\"\\n=== Generating Test Predictions ===\")\nPRED_DIR = WORKING_DIR / \"predictions\"\nPRED_DIR.mkdir(exist_ok=True)\n\nsubmission_data = []\n\nfor case_id in test_cases:\n    print(f\"Predicting {case_id}...\")\n\n    # Predict with axial view\n    pred_volume = predict_case(final_model, TEST_DIR, case_id, axis=0)\n\n    # Threshold\n    pred_mask = (pred_volume > 0.5).astype(np.uint8)\n\n    # Load reference to get affine\n    ref_nii = nib.load(TEST_DIR / f\"{case_id}_dwi.nii.gz\")\n\n    # Save prediction\n    pred_nii = nib.Nifti1Image(pred_mask, ref_nii.affine, ref_nii.header)\n    pred_path = PRED_DIR / f\"{case_id}_pred.nii.gz\"\n    nib.save(pred_nii, pred_path)\n\n    submission_data.append(\n        {\n            \"case_id\": case_id,\n            \"predicted_mask_path\": f\"predictions/{case_id}_pred.nii.gz\",\n        }\n    )\n\n# Create submission file\nsubmission_df = pd.DataFrame(submission_data)\nsubmission_df.to_csv(WORKING_DIR / \"submission.csv\", index=False)\n\nprint(f\"\\n=== Submission Created ===\")\nprint(f\"Predictions saved to: {PRED_DIR}\")\nprint(f\"Submission file: {WORKING_DIR / 'submission.csv'}\")\nprint(f\"\\nFinal Cross-Validation Mean Dice Score: {mean_dice:.4f}\")", "import os\nimport numpy as np\nimport pandas as pd\nimport nibabel as nib\nfrom pathlib import Path\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nfrom torch.utils.data import Dataset, DataLoader\nfrom sklearn.model_selection import KFold\nimport warnings\n\nwarnings.filterwarnings(\"ignore\")\n\n# Set device\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\n# Paths\ntrain_dir = Path(\"./input/train\")\ntest_dir = Path(\"./input/test\")\nworking_dir = Path(\"./working\")\nworking_dir.mkdir(exist_ok=True)\n\n# Load sample submission to get test case IDs\nsample_sub = pd.read_csv(\"./input/sample_submission.csv\")\ntest_case_ids = sample_sub[\"case_id\"].tolist()\n\n# Get training case IDs\ntrain_files = list(train_dir.glob(\"*_msk.nii.gz\"))\ntrain_case_ids = [f.name.replace(\"_msk.nii.gz\", \"\") for f in train_files]\nprint(f\"Found {len(train_case_ids)} training cases\")\nprint(f\"Found {len(test_case_ids)} test cases\")\n\n\n# Helper functions\ndef load_nifti(path):\n    \"\"\"Load NIfTI file and return data array\"\"\"\n    return nib.load(str(path)).get_fdata()\n\n\ndef normalize_volume(volume):\n    \"\"\"Normalize volume to [0, 1] range\"\"\"\n    volume = volume.astype(np.float32)\n    pmin, pmax = np.percentile(volume, [1, 99])\n    volume = np.clip(volume, pmin, pmax)\n    if pmax > pmin:\n        volume = (volume - pmin) / (pmax - pmin)\n    return volume\n\n\n# 2.5D Dataset\nclass StrokeDataset2_5D(Dataset):\n    def __init__(self, case_ids, data_dir, is_test=False, augment=False):\n        self.case_ids = case_ids\n        self.data_dir = Path(data_dir)\n        self.is_test = is_test\n        self.augment = augment\n\n        # Pre-load all volumes and create slice index\n        self.slices = []\n        for case_id in case_ids:\n            adc = load_nifti(self.data_dir / f\"{case_id}_adc.nii.gz\")\n            dwi = load_nifti(self.data_dir / f\"{case_id}_dwi.nii.gz\")\n            flair = load_nifti(self.data_dir / f\"{case_id}_flair.nii.gz\")\n\n            if not is_test:\n                mask = load_nifti(self.data_dir / f\"{case_id}_msk.nii.gz\")\n            else:\n                mask = None\n\n            # Normalize\n            adc = normalize_volume(adc)\n            dwi = normalize_volume(dwi)\n            flair = normalize_volume(flair)\n\n            # Store slices with lesions (or all slices for test)\n            num_slices = adc.shape[2]\n            for slice_idx in range(num_slices):\n                if is_test:\n                    self.slices.append((case_id, slice_idx, adc, dwi, flair, mask))\n                else:\n                    # Only include slices with lesions or randomly sample negatives\n                    if mask[:, :, slice_idx].sum() > 0 or np.random.rand() < 0.3:\n                        self.slices.append((case_id, slice_idx, adc, dwi, flair, mask))\n\n        print(\n            f\"Dataset created with {len(self.slices)} slices from {len(case_ids)} cases\"\n        )\n\n    def __len__(self):\n        return len(self.slices)\n\n    def __getitem__(self, idx):\n        case_id, slice_idx, adc, dwi, flair, mask = self.slices[idx]\n\n        # Get 2.5D input (current slice + adjacent slices)\n        num_slices = adc.shape[2]\n        prev_idx = max(0, slice_idx - 1)\n        next_idx = min(num_slices - 1, slice_idx + 1)\n\n        # Stack modalities and adjacent slices: 9 channels total\n        input_slice = np.stack(\n            [\n                adc[:, :, prev_idx],\n                dwi[:, :, prev_idx],\n                flair[:, :, prev_idx],\n                adc[:, :, slice_idx],\n                dwi[:, :, slice_idx],\n                flair[:, :, slice_idx],\n                adc[:, :, next_idx],\n                dwi[:, :, next_idx],\n                flair[:, :, next_idx],\n            ],\n            axis=0,\n        )\n\n        if not self.is_test:\n            mask_slice = mask[:, :, slice_idx].astype(np.float32)\n        else:\n            mask_slice = np.zeros(adc.shape[:2], dtype=np.float32)\n\n        # Augmentation\n        if self.augment and not self.is_test:\n            if np.random.rand() > 0.5:\n                input_slice = np.flip(input_slice, axis=1).copy()\n                mask_slice = np.flip(mask_slice, axis=0).copy()\n            if np.random.rand() > 0.5:\n                input_slice = np.flip(input_slice, axis=2).copy()\n                mask_slice = np.flip(mask_slice, axis=1).copy()\n\n        input_slice = torch.from_numpy(input_slice).float()\n        mask_slice = torch.from_numpy(mask_slice).float().unsqueeze(0)\n\n        return input_slice, mask_slice, case_id, slice_idx\n\n\n# ResNet-based U-Net model\nclass ResBlock(nn.Module):\n    def __init__(self, in_channels, out_channels):\n        super().__init__()\n        self.conv1 = nn.Conv2d(in_channels, out_channels, 3, padding=1)\n        self.bn1 = nn.BatchNorm2d(out_channels)\n        self.conv2 = nn.Conv2d(out_channels, out_channels, 3, padding=1)\n        self.bn2 = nn.BatchNorm2d(out_channels)\n\n        self.shortcut = nn.Sequential()\n        if in_channels != out_channels:\n            self.shortcut = nn.Sequential(\n                nn.Conv2d(in_channels, out_channels, 1), nn.BatchNorm2d(out_channels)\n            )\n\n    def forward(self, x):\n        residual = self.shortcut(x)\n        x = F.relu(self.bn1(self.conv1(x)))\n        x = self.bn2(self.conv2(x))\n        x += residual\n        x = F.relu(x)\n        return x\n\n\nclass ResUNet(nn.Module):\n    def __init__(self, in_channels=9, out_channels=1):\n        super().__init__()\n\n        # Encoder\n        self.enc1 = ResBlock(in_channels, 32)\n        self.enc2 = ResBlock(32, 64)\n        self.enc3 = ResBlock(64, 128)\n        self.enc4 = ResBlock(128, 256)\n\n        # Bridge\n        self.bridge = ResBlock(256, 512)\n\n        # Decoder\n        self.up4 = nn.ConvTranspose2d(512, 256, 2, stride=2)\n        self.dec4 = ResBlock(512, 256)\n\n        self.up3 = nn.ConvTranspose2d(256, 128, 2, stride=2)\n        self.dec3 = ResBlock(256, 128)\n\n        self.up2 = nn.ConvTranspose2d(128, 64, 2, stride=2)\n        self.dec2 = ResBlock(128, 64)\n\n        self.up1 = nn.ConvTranspose2d(64, 32, 2, stride=2)\n        self.dec1 = ResBlock(64, 32)\n\n        self.out = nn.Conv2d(32, out_channels, 1)\n        self.pool = nn.MaxPool2d(2)\n\n    def forward(self, x):\n        # Encoder\n        e1 = self.enc1(x)\n        e2 = self.enc2(self.pool(e1))\n        e3 = self.enc3(self.pool(e2))\n        e4 = self.enc4(self.pool(e3))\n\n        # Bridge\n        b = self.bridge(self.pool(e4))\n\n        # Decoder with skip connections\n        d4 = self.up4(b)\n        d4 = torch.cat([d4, e4], dim=1)\n        d4 = self.dec4(d4)\n\n        d3 = self.up3(d4)\n        d3 = torch.cat([d3, e3], dim=1)\n        d3 = self.dec3(d3)\n\n        d2 = self.up2(d3)\n        d2 = torch.cat([d2, e2], dim=1)\n        d2 = self.dec2(d2)\n\n        d1 = self.up1(d2)\n        d1 = torch.cat([d1, e1], dim=1)\n        d1 = self.dec1(d1)\n\n        out = self.out(d1)\n        return out\n\n\n# Dice loss\nclass DiceLoss(nn.Module):\n    def __init__(self, smooth=1.0):\n        super().__init__()\n        self.smooth = smooth\n\n    def forward(self, pred, target):\n        pred = torch.sigmoid(pred)\n        pred = pred.view(-1)\n        target = target.view(-1)\n\n        intersection = (pred * target).sum()\n        dice = (2.0 * intersection + self.smooth) / (\n            pred.sum() + target.sum() + self.smooth\n        )\n\n        return 1 - dice\n\n\n# Combined loss\nclass CombinedLoss(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.dice_loss = DiceLoss()\n        self.bce_loss = nn.BCEWithLogitsLoss()\n\n    def forward(self, pred, target):\n        return self.dice_loss(pred, target) + self.bce_loss(pred, target)\n\n\n# Dice metric\ndef dice_score(pred, target, threshold=0.5):\n    pred = (torch.sigmoid(pred) > threshold).float()\n    pred = pred.view(-1)\n    target = target.view(-1)\n\n    intersection = (pred * target).sum()\n    if pred.sum() + target.sum() == 0:\n        return 1.0\n\n    dice = (2.0 * intersection) / (pred.sum() + target.sum())\n    return dice.item()\n\n\n# Training function\ndef train_epoch(model, loader, optimizer, criterion, device):\n    model.train()\n    total_loss = 0\n    total_dice = 0\n\n    for batch_idx, (inputs, targets, _, _) in enumerate(loader):\n        inputs, targets = inputs.to(device), targets.to(device)\n\n        optimizer.zero_grad()\n        outputs = model(inputs)\n\n        loss = criterion(outputs, targets)\n        loss.backward()\n        optimizer.step()\n\n        total_loss += loss.item()\n        total_dice += dice_score(outputs, targets)\n\n    return total_loss / len(loader), total_dice / len(loader)\n\n\n# Validation function\ndef validate(model, loader, criterion, device):\n    model.eval()\n    total_loss = 0\n    total_dice = 0\n\n    with torch.no_grad():\n        for inputs, targets, _, _ in loader:\n            inputs, targets = inputs.to(device), targets.to(device)\n            outputs = model(inputs)\n\n            loss = criterion(outputs, targets)\n            total_loss += loss.item()\n            total_dice += dice_score(outputs, targets)\n\n    return total_loss / len(loader), total_dice / len(loader)\n\n\n# 5-Fold Cross-Validation\nkf = KFold(n_splits=5, shuffle=True, random_state=42)\nfold_dice_scores = []\n\nprint(\"\\nStarting 5-Fold Cross-Validation...\")\n\nfor fold, (train_idx, val_idx) in enumerate(kf.split(train_case_ids)):\n    print(f\"\\n{'='*50}\")\n    print(f\"Fold {fold+1}/5\")\n    print(f\"{'='*50}\")\n\n    train_cases = [train_case_ids[i] for i in train_idx]\n    val_cases = [train_case_ids[i] for i in val_idx]\n\n    # Create datasets\n    train_dataset = StrokeDataset2_5D(\n        train_cases, train_dir, is_test=False, augment=True\n    )\n    val_dataset = StrokeDataset2_5D(val_cases, train_dir, is_test=False, augment=False)\n\n    train_loader = DataLoader(train_dataset, batch_size=16, shuffle=True, num_workers=4)\n    val_loader = DataLoader(val_dataset, batch_size=16, shuffle=False, num_workers=4)\n\n    # Model, optimizer, criterion\n    model = ResUNet(in_channels=9, out_channels=1).to(device)\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\n    scheduler = torch.optim.lr_scheduler.ReduceLROnPlateau(\n        optimizer, mode=\"max\", factor=0.5, patience=3\n    )\n    criterion = CombinedLoss()\n\n    best_dice = 0\n    patience_counter = 0\n    max_patience = 5\n\n    # Train for fewer epochs per fold\n    for epoch in range(15):\n        train_loss, train_dice = train_epoch(\n            model, train_loader, optimizer, criterion, device\n        )\n        val_loss, val_dice = validate(model, val_loader, criterion, device)\n\n        scheduler.step(val_dice)\n\n        print(\n            f\"Epoch {epoch+1}/15: Train Loss={train_loss:.4f}, Train Dice={train_dice:.4f}, \"\n            f\"Val Loss={val_loss:.4f}, Val Dice={val_dice:.4f}\"\n        )\n\n        if val_dice > best_dice:\n            best_dice = val_dice\n            patience_counter = 0\n            # Save best model for this fold\n            torch.save(model.state_dict(), working_dir / f\"best_model_fold{fold}.pth\")\n        else:\n            patience_counter += 1\n            if patience_counter >= max_patience:\n                print(f\"Early stopping at epoch {epoch+1}\")\n                break\n\n    fold_dice_scores.append(best_dice)\n    print(f\"Fold {fold+1} Best Dice: {best_dice:.4f}\")\n\n# Print CV results\nmean_dice = np.mean(fold_dice_scores)\nstd_dice = np.std(fold_dice_scores)\nprint(f\"\\n{'='*50}\")\nprint(f\"5-Fold Cross-Validation Results:\")\nprint(f\"{'='*50}\")\nprint(f\"Mean Dice Score: {mean_dice:.4f} \u00b1 {std_dice:.4f}\")\nprint(f\"Individual Fold Scores: {[f'{d:.4f}' for d in fold_dice_scores]}\")\n\n# Train final model on all training data\nprint(f\"\\n{'='*50}\")\nprint(\"Training final model on all training data...\")\nprint(f\"{'='*50}\")\n\nfull_train_dataset = StrokeDataset2_5D(\n    train_case_ids, train_dir, is_test=False, augment=True\n)\nfull_train_loader = DataLoader(\n    full_train_dataset, batch_size=16, shuffle=True, num_workers=4\n)\n\nfinal_model = ResUNet(in_channels=9, out_channels=1).to(device)\noptimizer = torch.optim.Adam(final_model.parameters(), lr=1e-3)\nscheduler = torch.optim.lr_scheduler.CosineAnnealingLR(optimizer, T_max=20)\ncriterion = CombinedLoss()\n\nfor epoch in range(20):\n    train_loss, train_dice = train_epoch(\n        final_model, full_train_loader, optimizer, criterion, device\n    )\n    scheduler.step()\n    print(\n        f\"Epoch {epoch+1}/20: Train Loss={train_loss:.4f}, Train Dice={train_dice:.4f}\"\n    )\n\n# Save final model\ntorch.save(final_model.state_dict(), working_dir / \"final_model.pth\")\n\n# Generate predictions for test set\nprint(f\"\\n{'='*50}\")\nprint(\"Generating test predictions...\")\nprint(f\"{'='*50}\")\n\nfinal_model.eval()\n\n# Create predictions directory\npred_dir = working_dir / \"predictions\"\npred_dir.mkdir(exist_ok=True)\n\nsubmission_data = []\n\nfor case_id in test_case_ids:\n    print(f\"Processing {case_id}...\")\n\n    # Load test volumes\n    adc = load_nifti(test_dir / f\"{case_id}_adc.nii.gz\")\n    dwi = load_nifti(test_dir / f\"{case_id}_dwi.nii.gz\")\n    flair = load_nifti(test_dir / f\"{case_id}_flair.nii.gz\")\n\n    # Get original NIfTI for header info\n    original_nii = nib.load(test_dir / f\"{case_id}_adc.nii.gz\")\n\n    # Normalize\n    adc = normalize_volume(adc)\n    dwi = normalize_volume(dwi)\n    flair = normalize_volume(flair)\n\n    # Predict slice by slice\n    num_slices = adc.shape[2]\n    pred_volume = np.zeros(adc.shape, dtype=np.float32)\n\n    with torch.no_grad():\n        for slice_idx in range(num_slices):\n            prev_idx = max(0, slice_idx - 1)\n            next_idx = min(num_slices - 1, slice_idx + 1)\n\n            # Create 2.5D input\n            input_slice = np.stack(\n                [\n                    adc[:, :, prev_idx],\n                    dwi[:, :, prev_idx],\n                    flair[:, :, prev_idx],\n                    adc[:, :, slice_idx],\n                    dwi[:, :, slice_idx],\n                    flair[:, :, slice_idx],\n                    adc[:, :, next_idx],\n                    dwi[:, :, next_idx],\n                    flair[:, :, next_idx],\n                ],\n                axis=0,\n            )\n\n            inpu n as nn\nimport torch.nn.functional as F\nfrom torch.utils.data import Dataset, DataLoader\nfrom sklearn.model_selection import KFold\nimport warnings\n\nwarnings.filterwarnings(\"ignore\")\n\n# Set device\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\n# Paths\ntrain_dir = Path(\"./input/train\")\ntest_dir = Path(\"./input/test\")\nworking_dir = Path(\"./working\")\nworking_dir.mkdir(exist_ok=True)\n\n# Load sample submission to get test case IDs\nsample_sub = pd.read_csv(\"./input/sample_submission.csv\")\ntest_case_ids = sample_sub[\"case_id\"].tolist()\n\n# Get training case IDs\ntrain_files = list(train_dir.glob(\"*_msk.nii.gz\"))\ntrain_case_ids = [f.name.replace(\"_msk.nii.gz\", \"\") for f in train_files]\nprint(f\"Found {len(train_case_ids)} training cases\")\nprint(f\"Found {len(test_case_ids)} test cases\")\n\n\n# Helper functions\ndef load_nifti(path):\n    \"\"\"Load NIfTI file and return data array\"\"\"\n    return nib.load(str(path)).get_fdata()\n\n\ndef normalize_volume(volume):\n    \"\"\"Normalize volume to [0, 1] range\"\"\"\n    volume = volume.astype(np.float32)\n    pmin, pmax = np.percentile(volume, [1, 99])\n    volume = np.clip(volume, pmin, pmax)\n    if pmax > pmin:\n        volume = (volume - pmin) / (pmax - pmin)\n    return volume\n\n\n# 2.5D Dataset - Fixed version\nclass StrokeDataset2_5D(Dataset):\n    def __init__(self, case_ids, data_dir, is_test=False, augment=False):\n        self.case_ids = case_ids\n        self.data_dir = Path(data_dir)\n        self.is_test = is_test\n        self.augment = augment\n\n        # Create slice index without pre-loading volumes\n        self.slices = []\n        for case_id in case_ids:\n            # Load mask to determine which slices to include\n            if not is_test:\n                mask_path = self.data_dir / f\"{case_id}_msk.nii.gz\"\n                mask = load_nifti(mask_path)\n                num_slices = mask.shape[2]\n\n                # Only include slices with lesions or randomly sample negatives\n                for slice_idx in range(num_slices):\n                    if mask[:, :, slice_idx].sum() > 0 or np.random.rand() < 0.3:\n                        self.slices.append((case_id, slice_idx))\n            else:\n                # For test, we need to know number of slices\n                adc_path = self.data_dir / f\"{case_id}_adc.nii.gz\"\n                adc = load_nifti(adc_path)\n                num_slices = adc.shape[2]\n                for slice_idx in range(num_slices):\n                    self.slices.append((case_id, slice_idx))\n\n        print(\n            f\"Dataset created with {len(self.slices)} slices from {len(case_ids)} cases\"\n        )\n\n    def __len__(self):\n        return len(self.slices)\n\n    def __getitem__(self, idx):\n        case_id, slice_idx = self.slices[idx]\n\n        # Load volumes on-demand\n        adc = load_nifti(self.data_dir / f\"{case_id}_adc.nii.gz\")\n        dwi = load_nifti(self.data_dir / f\"{case_id}_dwi.nii.gz\")\n        flair = load_nifti(self.data_dir / f\"{case_id}_flair.nii.gz\")\n\n        # Normalize\n        adc = normalize_volume(adc)\n        dwi = normalize_volume(dwi)\n        flair = normalize_volume(flair)\n\n        if not self.is_test:\n            mask = load_nifti(self.data_dir / f\"{case_id}_msk.nii.gz\")\n        else:\n            mask = None\n\n        # Get 2.5D input (current slice + adjacent slices)\n        num_slices = adc.shape[2]\n        prev_idx = max(0, slice_idx - 1)\n        next_idx = min(num_slices - 1, slice_idx + 1)\n\n        # Stack modalities and adjacent slices: 9 channels total\n        input_slice = np.stack(\n            [\n                adc[:, :, prev_idx],\n                dwi[:, :, prev_idx],\n                flair[:, :, prev_idx],\n                adc[:, :, slice_idx],\n                dwi[:, :, slice_idx],\n                flair[:, :, slice_idx],\n                adc
